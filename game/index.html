<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Klotz Kaskade</title>
<style>
  :root {
    --bg: #1b1235;
    --bg-2: #2d0f4a;
    --bg-3: #0f2a55;
    --panel: rgba(42, 28, 82, 0.85);
    --panel-solid: #2a1c52;
    --cell: #34265f;
    --cell-line: #46377a;
    --text: #fbf7ff;
    --muted: #c4b6ec;
    --accent: #ffd60a;
    --stone: #7a6fa3;
    --button: #5b47a8;
    --danger: #ff4d6d;
    --ghost-ok: rgba(255, 255, 255, 0.4);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%;
    background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    overscroll-behavior: none; user-select: none;
  }
  body {
    background: linear-gradient(135deg, var(--bg), var(--bg-2), var(--bg-3), var(--bg));
    background-size: 400% 400%;
    animation: bgshift 24s ease infinite;
  }
  @keyframes bgshift {
    0%, 100% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
  }
  #bg { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }

  /* ---------- Screens ---------- */
  .screen {
    position: relative; z-index: 1;
    max-width: 480px; margin: 0 auto; padding: 16px;
    min-height: 100%;
    display: flex; flex-direction: column; align-items: center; gap: 12px;
  }
  .screen.enter { animation: screen-in 0.3s ease-out; }
  @keyframes screen-in { from { opacity: 0; transform: translateY(16px); } }
  .topbar { width: 100%; display: flex; align-items: center; gap: 10px; }
  .topbar h2 { margin: 0; font-size: 22px; flex: 1; }
  .icon-btn {
    width: 40px; height: 40px; margin: 0; padding: 0; border-radius: 12px; flex: none;
    background: var(--panel); color: var(--text); font-size: 18px;
  }

  /* Title screen */
  #screen-title { justify-content: center; gap: 28px; }
  .logo { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .logo-row { display: flex; gap: 6px; }
  .logo-tile {
    width: clamp(44px, 14vw, 62px); height: clamp(44px, 14vw, 62px);
    display: flex; align-items: center; justify-content: center;
    font-size: clamp(26px, 8.5vw, 38px); font-weight: 900; color: #fff;
    border-radius: 12px; text-shadow: 0 2px 0 rgba(0,0,0,0.25);
    background-image: linear-gradient(180deg, rgba(255,255,255,0.4), rgba(255,255,255,0) 55%);
    box-shadow: inset 0 -5px 0 rgba(0,0,0,0.25), inset 0 3px 0 rgba(255,255,255,0.45), 0 6px 18px rgba(0,0,0,0.3);
    animation: tile-drop 0.6s cubic-bezier(.3,1.6,.6,1) backwards, tile-bob 3s ease-in-out infinite;
  }
  @keyframes tile-drop { from { transform: translateY(-120vh) rotate(-20deg); } }
  @keyframes tile-bob { 50% { transform: translateY(-5px); } }
  .logo-sub {
    font-size: clamp(22px, 7vw, 30px); font-weight: 900; letter-spacing: 8px;
    background: linear-gradient(90deg, #ff4d6d, #ffd60a, #38e54d, #00c2ff, #c86bff);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    animation: fade-in 0.6s 0.9s ease-out backwards;
  }
  @keyframes fade-in { from { opacity: 0; transform: scale(0.8); } }
  .title-actions { width: min(300px, 100%); display: flex; flex-direction: column; gap: 12px; animation: fade-in 0.5s 1.1s backwards; }
  .play-btn { font-size: 22px; padding: 18px; animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 50% { transform: scale(1.05); box-shadow: 0 0 30px rgba(255, 214, 10, 0.6); } }
  .pill {
    align-self: center; padding: 6px 14px; border-radius: 999px; background: var(--panel);
    font-size: 14px; font-weight: 700;
  }

  /* Home screen */
  .home-title {
    margin: 4px 0 0; font-size: 26px; font-weight: 900; text-align: center;
    background: linear-gradient(90deg, #ff4d6d, #ffd60a, #38e54d, #00c2ff, #c86bff);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .mode-card {
    width: 100%; margin: 0; padding: 18px; border-radius: 18px; text-align: left;
    display: flex; align-items: center; gap: 14px; color: #fff;
    box-shadow: inset 0 -5px 0 rgba(0,0,0,0.2), 0 8px 24px rgba(0,0,0,0.25);
    transition: transform 0.15s;
  }
  .mode-card:active { transform: scale(0.97); }
  .mode-card .emoji { font-size: 36px; flex: none; }
  .mode-card .txt { flex: 1; min-width: 0; }
  .mode-card .name { font-size: 20px; font-weight: 900; display: block; text-shadow: 0 1px 0 rgba(0,0,0,0.25); }
  .mode-card .info { font-size: 13px; font-weight: 600; opacity: 0.92; display: block; margin-top: 3px; }
  .card-daily { background: linear-gradient(135deg, #ff4d6d, #ff9f1c); }
  .card-endless { background: linear-gradient(135deg, #00a6ff, #8f5bff); }
  .card-levels { background: linear-gradient(135deg, #1fbf5a, #00b3a4); }
  .home-nav { width: 100%; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: auto; }
  .home-nav button { margin: 0; }

  /* Level map */
  .map { width: 100%; display: flex; flex-direction: column-reverse; gap: 14px; padding: 8px 0 24px; position: relative; }
  .map::before {
    content: ""; position: absolute; left: 50%; top: 20px; bottom: 40px; width: 6px; margin-left: -3px;
    background: repeating-linear-gradient(180deg, var(--muted) 0 10px, transparent 10px 20px); opacity: 0.35;
  }
  .map-row { display: flex; position: relative; }
  .map-row:nth-child(4n+1) { justify-content: center; }
  .map-row:nth-child(4n+2) { justify-content: flex-start; padding-left: 12%; }
  .map-row:nth-child(4n+3) { justify-content: center; }
  .map-row:nth-child(4n+4) { justify-content: flex-end; padding-right: 12%; }
  .level-node {
    width: 76px; height: 76px; margin: 0; padding: 0; border-radius: 50%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-size: 26px; font-weight: 900; color: #fff;
    background: linear-gradient(180deg, #9b7bff, #5b47a8);
    box-shadow: inset 0 -5px 0 rgba(0,0,0,0.25), 0 6px 16px rgba(0,0,0,0.35);
  }
  .level-node small { font-size: 12px; letter-spacing: -1px; color: var(--accent); }
  .level-node.done { background: linear-gradient(180deg, #ffd60a, #ff9f1c); color: #4a2a00; }
  .level-node.done small { color: #7a3d00; }
  .level-node.current { animation: pulse 1.6s ease-in-out infinite; background: linear-gradient(180deg, #38e54d, #1f9e3a); }
  .level-node:disabled { background: #3a2f63; color: #6d6491; cursor: default; }
  .stars-total { font-weight: 800; color: var(--accent); }

  /* Stats & settings */
  .list { width: 100%; display: flex; flex-direction: column; gap: 10px; }
  .row {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 14px 16px; border-radius: 14px; background: var(--panel);
  }
  .row .label { color: var(--muted); }
  .row .value { font-size: 20px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .toggle {
    width: 54px; height: 32px; margin: 0; padding: 0; border-radius: 999px; flex: none; position: relative;
    background: #4b3f78;
  }
  .toggle::after {
    content: ""; position: absolute; top: 4px; left: 4px; width: 24px; height: 24px; border-radius: 50%;
    background: #fff; transition: transform 0.2s;
  }
  .toggle[aria-checked="true"] { background: #38e54d; }
  .toggle[aria-checked="true"]::after { transform: translateX(22px); }
  .danger { background: var(--danger); color: #fff; }
  .confirm-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .confirm-row button { margin: 0; }

  /* ---------- Game screen ---------- */
  /* No scrolling or zooming while dragging pieces; menu screens stay scrollable. */
  #screen-game { touch-action: none; }
  header { width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .hud-left { display: flex; align-items: center; gap: 10px; min-width: 0; }
  #status { font-size: 14px; color: var(--muted); font-weight: 600; }
  .scores { text-align: right; }
  .score { font-size: 32px; font-weight: 800; color: var(--accent); line-height: 1; text-shadow: 0 0 18px rgba(255, 214, 10, 0.5); }
  .score.bump { animation: bump 0.3s ease-out; }
  @keyframes bump { 50% { transform: scale(1.25); } }
  .best { font-size: 13px; color: var(--muted); margin-top: 4px; }
  #goal { width: 100%; height: 10px; background: var(--panel); border-radius: 5px; overflow: hidden; }
  #goal-fill {
    height: 100%; width: 0; transition: width 0.3s;
    background: linear-gradient(90deg, #ff4d6d, #ffd60a, #38e54d, #00c2ff);
  }
  #combo {
    height: 28px; font-size: 20px; font-weight: 900; opacity: 0;
    background: linear-gradient(90deg, #ff4d6d, #ffd60a, #38e54d, #00c2ff, #c86bff, #ff4d6d);
    background-size: 200% 100%;
    -webkit-background-clip: text; background-clip: text; color: transparent;
    animation: rainbow 1.2s linear infinite;
  }
  #combo.pop { animation: rainbow 1.2s linear infinite, combo-pop 0.4s ease-out; }
  @keyframes rainbow { to { background-position: 200% 0; } }
  @keyframes combo-pop { 0% { transform: scale(0.5); } 60% { transform: scale(1.3); } 100% { transform: scale(1); } }
  #board {
    --size: min(calc(100vw - 32px), 420px);
    width: var(--size); height: var(--size);
    display: grid; grid-template-columns: repeat(8, 1fr); gap: 3px;
    padding: 6px; background: var(--panel); border-radius: 14px;
    box-shadow: 0 0 40px rgba(140, 90, 255, 0.35);
  }
  #board.shake { animation: shake 0.35s ease-out; }
  @keyframes shake {
    20% { transform: translate(-6px, 3px) rotate(-0.6deg); }
    40% { transform: translate(5px, -4px) rotate(0.5deg); }
    60% { transform: translate(-4px, 2px); }
    80% { transform: translate(2px, -1px); }
  }
  .cell { background: var(--cell); border-radius: 5px; box-shadow: inset 0 0 0 1px var(--cell-line); }
  .block {
    border-radius: 5px;
    background-image: linear-gradient(180deg, rgba(255,255,255,0.4), rgba(255,255,255,0) 55%);
    box-shadow: inset 0 -4px 0 rgba(0,0,0,0.25), inset 0 2px 0 rgba(255,255,255,0.45), 0 0 10px rgba(255,255,255,0.12);
  }
  .cell.placed { animation: land 0.3s ease-out; }
  @keyframes land { 0% { transform: scale(1.25); filter: brightness(1.8); } 100% { transform: scale(1); } }
  .cell.ghost { background: var(--ghost-ok); }
  .cell.will-clear { filter: brightness(1.6) saturate(1.3); }
  .cell.clearing { animation: pop 0.35s ease-out forwards; }
  @keyframes pop {
    0% { transform: scale(1); }
    50% { transform: scale(1.2); filter: brightness(2.2); }
    100% { transform: scale(0) rotate(30deg); opacity: 0; }
  }
  #tray {
    width: 100%; min-height: 130px;
    display: grid; grid-template-columns: repeat(3, 1fr); align-items: center; justify-items: center;
  }
  .slot { width: 100%; height: 120px; display: flex; align-items: center; justify-content: center; }
  .piece { display: grid; gap: 2px; cursor: grab; touch-action: none; animation: deal 0.35s ease-out backwards; }
  .slot:nth-child(2) .piece { animation-delay: 0.06s; }
  .slot:nth-child(3) .piece { animation-delay: 0.12s; }
  @keyframes deal { from { transform: translateY(30px) scale(0.6); opacity: 0; } }
  .piece.unfit { opacity: 0.35; }
  .piece.hidden { visibility: hidden; }
  #drag { position: fixed; left: 0; top: 0; pointer-events: none; z-index: 10; display: grid; gap: 3px; filter: drop-shadow(0 8px 12px rgba(0,0,0,0.4)); }
  #fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 30; }
  .floater {
    position: fixed; z-index: 31; pointer-events: none; font-weight: 900; font-size: 24px;
    color: var(--accent); text-shadow: 0 2px 0 rgba(0,0,0,0.35), 0 0 12px rgba(255, 214, 10, 0.6);
    transform: translate(-50%, -50%); animation: float-up 0.9s ease-out forwards;
  }
  @keyframes float-up {
    0% { opacity: 0; transform: translate(-50%, -30%) scale(0.6); }
    20% { opacity: 1; transform: translate(-50%, -60%) scale(1.15); }
    100% { opacity: 0; transform: translate(-50%, -160%) scale(1); }
  }
  #btn-luck {
    width: auto; margin: 0; padding: 10px 18px; border-radius: 999px; font-size: 14px;
    background: linear-gradient(135deg, #38e54d, #00c2ff); color: #062a12;
  }
  #btn-luck:disabled { background: var(--panel); color: var(--muted); cursor: default; }
  #btn-luck.active { animation: glow 1.4s ease-in-out infinite; }
  @keyframes glow { 50% { box-shadow: 0 0 22px rgba(56, 229, 77, 0.8); } }
  #toast {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 40;
    background: var(--panel-solid); color: var(--text); padding: 12px 18px; border-radius: 12px;
    width: max-content; max-width: calc(100vw - 32px); text-align: center; font-size: 14px;
  }

  /* ---------- Dialogs ---------- */
  #overlay {
    position: fixed; inset: 0; background: rgba(10, 6, 25, 0.8);
    display: none; align-items: center; justify-content: center; z-index: 20;
  }
  #overlay.show { display: flex; }
  .dialog {
    background: var(--panel-solid); padding: 26px 22px; border-radius: 18px; text-align: center;
    width: min(340px, calc(100vw - 32px)); max-height: calc(100% - 32px); overflow-y: auto;
    box-shadow: 0 0 50px rgba(140, 90, 255, 0.4); animation: fade-in 0.25s ease-out;
  }
  .dialog h2 { margin: 0 0 8px; }
  .dialog p { color: var(--muted); margin: 6px 0 16px; }
  button {
    display: block; width: 100%; margin-top: 10px; padding: 14px; border: 0; border-radius: 12px;
    font-size: 16px; font-weight: 700; cursor: pointer; font-family: inherit;
  }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .primary { background: var(--accent); color: #2a1d00; }
  .secondary { background: var(--button); color: var(--text); }
  .rescue { background: linear-gradient(135deg, #38e54d, #00c2ff); color: #062a12; animation: pulse 1.6s ease-in-out infinite; }
  button small { display: block; font-weight: 500; font-size: 12px; opacity: 0.85; margin-top: 2px; }
  .stars { font-size: 40px; letter-spacing: 6px; margin: 4px 0 6px; }
  .stars span { display: inline-block; color: #4b3f78; }
  .stars span.on { color: var(--accent); text-shadow: 0 0 16px rgba(255, 214, 10, 0.8); animation: star-in 0.5s ease-out backwards; }
  .stars span:nth-child(2).on { animation-delay: 0.25s; }
  .stars span:nth-child(3).on { animation-delay: 0.5s; }
  @keyframes star-in { from { transform: scale(0) rotate(-90deg); } 70% { transform: scale(1.4); } }
  #win-streak { color: #ffb347; font-weight: 700; }
  .ad-box {
    margin: 4px 0 14px; padding: 36px 12px; border-radius: 12px; font-weight: 700;
    background: repeating-linear-gradient(45deg, #3a2a6e, #3a2a6e 12px, #33245f 12px, #33245f 24px);
    color: var(--muted);
  }
  #ad-count { font-size: 40px; color: var(--text); display: block; margin-top: 6px; }
  [hidden] { display: none !important; }
  @media (prefers-reduced-motion: reduce) {
    body, #combo, .piece, .logo-tile, .play-btn, .rescue, .level-node.current { animation: none; }
  }
</style>
</head>
<body>
<canvas id="bg"></canvas>

<!-- Title screen -->
<div class="screen" id="screen-title">
  <div class="logo" aria-label="Klotz Kaskade">
    <div class="logo-row" id="logo-row"></div>
    <div class="logo-sub">KASKADE</div>
  </div>
  <div class="title-actions">
    <button class="primary play-btn" id="btn-play">Spielen</button>
    <div class="pill" id="title-streak" hidden></div>
  </div>
</div>

<!-- Home / main menu -->
<div class="screen" id="screen-home" hidden>
  <div class="home-title">Klotz Kaskade</div>
  <button class="mode-card card-daily" id="btn-daily">
    <span class="emoji">☀️</span>
    <span class="txt"><span class="name">Tages-Challenge</span><span class="info" id="daily-info"></span></span>
  </button>
  <button class="mode-card card-endless" id="btn-endless">
    <span class="emoji">♾️</span>
    <span class="txt"><span class="name">Endlos</span><span class="info" id="endless-info"></span></span>
  </button>
  <button class="mode-card card-levels" id="btn-levels">
    <span class="emoji">🗺️</span>
    <span class="txt"><span class="name">Level</span><span class="info" id="levels-info"></span></span>
  </button>
  <div class="home-nav">
    <button class="secondary" id="btn-stats">📊 Statistik</button>
    <button class="secondary" id="btn-settings">⚙️ Einstellungen</button>
  </div>
</div>

<!-- Level map -->
<div class="screen" id="screen-levels" hidden>
  <div class="topbar">
    <button class="icon-btn" data-back="screen-home" aria-label="Zurück">←</button>
    <h2>Level</h2>
    <span class="stars-total" id="stars-total"></span>
  </div>
  <div class="map" id="level-map"></div>
</div>

<!-- Stats -->
<div class="screen" id="screen-stats" hidden>
  <div class="topbar">
    <button class="icon-btn" data-back="screen-home" aria-label="Zurück">←</button>
    <h2>Statistik</h2>
  </div>
  <div class="list" id="stats-list"></div>
</div>

<!-- Settings -->
<div class="screen" id="screen-settings" hidden>
  <div class="topbar">
    <button class="icon-btn" data-back="screen-home" aria-label="Zurück">←</button>
    <h2>Einstellungen</h2>
  </div>
  <div class="list">
    <div class="row"><span>Soundeffekte</span><button class="toggle" id="set-sound" role="switch" aria-label="Soundeffekte"></button></div>
    <div class="row"><span>Musik</span><button class="toggle" id="set-music" role="switch" aria-label="Musik"></button></div>
    <div class="row"><span>Weniger Effekte</span><button class="toggle" id="set-calm" role="switch" aria-label="Weniger Effekte"></button></div>
    <button class="secondary" id="btn-reset">Fortschritt löschen</button>
    <div id="reset-confirm" hidden>
      <p style="color: var(--muted); text-align: center; margin: 4px 0 10px">Rekord, Sterne, Level und Serie werden gelöscht.</p>
      <div class="confirm-row">
        <button class="danger" id="btn-reset-yes">Ja, löschen</button>
        <button class="secondary" id="btn-reset-no">Abbrechen</button>
      </div>
    </div>
  </div>
</div>

<!-- Game -->
<div class="screen" id="screen-game" hidden>
  <header>
    <div class="hud-left">
      <button class="icon-btn" id="btn-pause" aria-label="Pause">⏸</button>
      <div id="status"></div>
    </div>
    <div class="scores">
      <div class="score" id="score">0</div>
      <div class="best" id="best-row">Rekord: <span id="best">0</span></div>
    </div>
  </header>
  <div id="goal" hidden><div id="goal-fill"></div></div>
  <div id="combo"></div>
  <div id="board"></div>
  <div id="tray"></div>
  <button id="btn-luck">🍀 Bessere Steine · Werbung ansehen</button>
</div>

<div id="drag"></div>
<canvas id="fx"></canvas>
<div id="toast" hidden></div>
<div id="overlay">
  <div class="dialog" id="dlg-pause" hidden>
    <h2>Pause</h2>
    <button class="primary" id="btn-resume">Weiterspielen</button>
    <button class="secondary" id="btn-pause-sound"></button>
    <button class="secondary" id="btn-pause-music"></button>
    <button class="secondary" id="btn-restart">Neu starten</button>
    <button class="secondary" id="btn-pause-home">Hauptmenü</button>
  </div>
  <div class="dialog" id="dlg-over" hidden>
    <h2>Kein Platz mehr!</h2>
    <p id="over-text"></p>
    <button class="rescue" id="btn-revive">Spiel retten<small id="revive-info"></small></button>
    <button class="secondary" id="btn-retry">Nochmal</button>
    <button class="secondary" id="btn-over-home">Hauptmenü</button>
  </div>
  <div class="dialog" id="dlg-win" hidden>
    <h2 id="win-title">Level geschafft!</h2>
    <div class="stars" id="win-stars"><span>★</span><span>★</span><span>★</span></div>
    <p id="win-text"></p>
    <p id="win-streak" hidden></p>
    <button class="primary" id="btn-next">Nächstes Level</button>
    <button class="secondary" id="btn-win-retry">Nochmal für mehr Sterne</button>
    <button class="secondary" id="btn-win-home">Hauptmenü</button>
  </div>
  <div class="dialog" id="dlg-ad" hidden>
    <h2>Werbung</h2>
    <div class="ad-box">Platzhalter für eine Belohnungs-Werbung<span id="ad-count">3</span></div>
    <p id="ad-reward"></p>
    <button class="primary" id="btn-ad-done" hidden>Belohnung abholen</button>
  </div>
</div>

<script>
(() => {
  const SIZE = 8;
  const COLORS = ['#ff4d6d', '#ff9f1c', '#ffd60a', '#38e54d', '#00c2ff', '#8f5bff', '#ff4fd8'];
  const STONE = getComputedStyle(document.documentElement).getPropertyValue('--stone').trim();
  const DAILY_LINES = 10;
  const MAX_RESCUES = 2;
  const BREAK_AFTER_MS = 20 * 60 * 1000;

  // Shapes as lists of [row, col]; weight controls how often a shape appears.
  const SHAPES = [
    { cells: [[0,0]], weight: 2 },
    { cells: [[0,0],[0,1]], weight: 3 },

  // ---------- Dates & seeded randomness for the daily challenge ----------
  function dateKey(d) {
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  }
  const todayKey = () => dateKey(new Date());
  const yesterdayKey = () => { const d = new Date(); d.setDate(d.getDate() - 1); return dateKey(d); };

  function hashString(s) {
    let h = 2166136261;
    for (const ch of s) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); }
    return h >>> 0;
  }
  // mulberry32: small seeded PRNG so every player gets the same daily board and pieces.
  function seededRandom(seed) {
    return () => {
      seed = (seed + 0x6D2B79F5) | 0;
      let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function dailyState() {
    const d = load('klotz-daily', { last: null, streak: 0, stars: {} });

  // ---------- Sound (synthesised with Web Audio, no files needed) ----------

  function getAudio() {
    if (!audio) {

    if (audio.state === 'suspended' && !document.hidden) audio.resume();

  function tone(freq, start, duration, { type = 'sine', volume = 0.15, slideTo = null, at = null } = {}) {
    const ctx = getAudio();
    if (!ctx) return;
    const t = at ?? ctx.currentTime + start;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t);
    if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, t + duration);
    gain.gain.setValueAtTime(0.0001, t);
    gain.gain.exponentialRampToValueAtTime(volume, t + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + duration);
    osc.connect(gain).connect(ctx.destination);
    osc.start(t);
    osc.stop(t + duration + 0.02);
  }

  // Small random pitch variation keeps repeated sounds from getting tiring.

  const PENTATONIC = [523.25, 587.33, 659.25, 783.99, 880, 1046.5, 1174.66, 1318.51, 1567.98];
  const sfxTone = (...args) => { if (!muted) tone(...args); };

    place: () => sfxTone(vary(180), 0, 0.12, { type: 'triangle', volume: 0.25, slideTo: 90 }),
    invalid: () => sfxTone(140, 0, 0.15, { type: 'square', volume: 0.05, slideTo: 100 }),
    clear(lineCount, streak) {
      // Longer streaks start the arpeggio higher, more lines add more notes.
      const startNote = Math.min(streak - 1, 3);
      const notes = 2 + lineCount;
      for (let i = 0; i < notes; i++) {
        const f = PENTATONIC[Math.min(startNote + i, PENTATONIC.length - 1)];
        sfxTone(f, i * 0.07, 0.25, { type: 'triangle', volume: 0.12 });
      }
    },
    gameOver() {
      [392, 330, 262, 196].forEach((f, i) => sfxTone(f, i * 0.16, 0.3, { type: 'sawtooth', volume: 0.06 }));

  // Background music: a gentle looping pentatonic tune, scheduled slightly ahead of time.
  const MUSIC_STEP = 60 / 104 / 2;
  const MELODY = [0, 2, 4, 2, 5, 4, 2, -1, 1, 3, 4, 3, 2, 0, 1, -1, 0, 2, 4, 5, 7, 5, 4, -1, 3, 2, 1, 2, 0, -1, -1, -1];
  const BASS = [130.81, 130.81, 174.61, 174.61, 196, 196, 130.81, 130.81];
  let musicStep = 0, musicTime = 0, musicTimer = null;

  function scheduleMusic() {
    const ctx = getAudio();
    if (!ctx || ctx.state !== 'running') return;
    if (musicTime < ctx.currentTime) musicTime = ctx.currentTime + 0.05;
    while (musicTime < ctx.currentTime + 0.25) {
      const note = MELODY[musicStep % MELODY.length];
      if (note >= 0) tone(PENTATONIC[note] / 2, 0, MUSIC_STEP * 1.6, { type: 'triangle', volume: 0.035, at: musicTime });
      if (musicStep % 4 === 0) tone(BASS[(musicStep / 4) % BASS.length], 0, MUSIC_STEP * 3.5, { type: 'sine', volume: 0.06, at: musicTime });
      musicStep++;
      musicTime += MUSIC_STEP;
    }
  }
  function updateMusic() {
    if (musicOn && !musicTimer) musicTimer = setInterval(scheduleMusic, 60);
    if (!musicOn && musicTimer) { clearInterval(musicTimer); musicTimer = null; }
  }

  function setMuted(value) { muted = value; save('klotz-muted', muted); renderSettings(); }

  // ---------- Background: slowly falling blocks on the menu screens ----------
  const bg = $('bg');
  const bgCtx = bg.getContext('2d');
  let bgBlocks = [], bgRunning = false;

  function resizeCanvas(canvas, ctx) {
    const dpr = window.devicePixelRatio || 1;
    canvas.width = innerWidth * dpr;
    canvas.height = innerHeight * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function updateBackground() {
    const wanted = currentScreen !== 'screen-game' && !reducedMotion();
    if (wanted && !bgRunning) { bgRunning = true; requestAnimationFrame(stepBg); }
    if (!wanted) { bgRunning = false; bgCtx.clearRect(0, 0, innerWidth, innerHeight); }
  }

  function stepBg() {
    if (!bgRunning) return;
    if (bgBlocks.length < 22 && Math.random() < 0.08) {
      const size = 18 + Math.random() * 26;
      bgBlocks.push({
        x: Math.random() * innerWidth, y: -size, size, vy: 0.4 + Math.random() * 0.9,
        rot: Math.random() * 6, vr: (Math.random() - 0.5) * 0.01, color: COLORS[Math.floor(Math.random() * COLORS.length)],
      });
    }
    bgCtx.clearRect(0, 0, innerWidth, innerHeight);
    bgBlocks = bgBlocks.filter(b => b.y < innerHeight + 60);
    for (const b of bgBlocks) {
      b.y += b.vy; b.rot += b.vr;
      bgCtx.save();
      bgCtx.globalAlpha = 0.28;
      bgCtx.translate(b.x, b.y);
      bgCtx.rotate(b.rot);
      bgCtx.fillStyle = b.color;
      bgCtx.beginPath();
      bgCtx.roundRect(-b.size / 2, -b.size / 2, b.size, b.size, b.size * 0.2);
      bgCtx.fill();
      bgCtx.restore();

    requestAnimationFrame(stepBg);

  // ---------- Visual effects: particles, confetti, floating text ----------
  const fx = $('fx');
  const fxCtx = fx.getContext('2d');
  let particles = [];
  let fxRunning = false;

  function onResize() { resizeCanvas(fx, fxCtx); resizeCanvas(bg, bgCtx); }
  window.addEventListener('resize', onResize);

  function burst(x, y, color, count, speed = 5) {
    if (reducedMotion()) count = Math.ceil(count / 4);
    for (let i = 0; i < count; i++) {
      const a = Math.random() * Math.PI * 2;
      const v = (0.4 + Math.random()) * speed;
      particles.push({
        x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 2, g: 0.18,
        size: 3 + Math.random() * 5, color, life: 1, decay: 0.018 + Math.random() * 0.02,
        rot: Math.random() * 6, vr: (Math.random() - 0.5) * 0.3, square: Math.random() < 0.6,
      });
    }
    startFx();
  }

  function confetti() {
    const count = reducedMotion() ? 40 : 160;
    for (let i = 0; i < count; i++) {
      particles.push({
        x: Math.random() * innerWidth, y: -20 - Math.random() * innerHeight * 0.5,
        vx: (Math.random() - 0.5) * 3, vy: 2 + Math.random() * 3, g: 0.05,
        size: 6 + Math.random() * 6, color: COLORS[i % COLORS.length], life: 1, decay: 0.004,
        rot: Math.random() * 6, vr: (Math.random() - 0.5) * 0.4, square: true,
      });
    }
    startFx();
  }

  function startFx() {
    if (particles.length > 600) particles = particles.slice(-600);
    if (!fxRunning) { fxRunning = true; requestAnimationFrame(stepFx); }
  }

  function stepFx() {
    fxCtx.clearRect(0, 0, innerWidth, innerHeight);
    particles = particles.filter(p => p.life > 0 && p.y < innerHeight + 40);
    for (const p of particles) {
      p.vy += p.g; p.x += p.vx; p.y += p.vy; p.rot += p.vr; p.life -= p.decay;
      fxCtx.save();
      fxCtx.globalAlpha = Math.max(0, p.life);
      fxCtx.fillStyle = p.color;
      fxCtx.translate(p.x, p.y);
      fxCtx.rotate(p.rot);
      if (p.square) fxCtx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2);
      else { fxCtx.beginPath(); fxCtx.arc(0, 0, p.size / 2, 0, Math.PI * 2); fxCtx.fill(); }
      fxCtx.restore();
    }
    if (particles.length) requestAnimationFrame(stepFx);
    else { fxRunning = false; fxCtx.clearRect(0, 0, innerWidth, innerHeight); }
  }

  // ---------- Board setup ----------
  for (let i = 0; i < SIZE * SIZE; i++) {

  function randomShape() {
    let r = rand() * TOTAL_WEIGHT;
    for (const s of SHAPES) { if ((r -= s.weight) < 0) return s.cells; }
    return SHAPES[0].cells;
  }

  function canPlaceOn(g, cells, row, col) {
    return cells.every(([r, c]) => {
      const rr = row + r, cc = col + c;
      return rr >= 0 && rr < SIZE && cc >= 0 && cc < SIZE && !g[rr][cc];
    });
  }
  const canPlace = (cells, row, col) => canPlaceOn(grid, cells, row, col);

  function fitsAnywhere(cells) {
    for (let r = 0; r < SIZE; r++)
      for (let c = 0; c < SIZE; c++)
        if (canPlace(cells, r, c)) return true;
    return false;
  }

  // ---------- Dealer: picks the next three pieces ----------
  // Four tiers: pure chance; a fair hand where all three pieces fit somehow; a hard hand
  // (the worst of several samples), which gets more likely the longer a round lasts;
  // and, during a luck boost, the best of many sampled hands.

  // Place a piece on a copy of the board and clear full lines. `contacts` counts neighbours
  // that are walls or blocks, which rewards placements that keep the board compact.
  function simulateMove(g, cells, row, col) {
    const next = g.map(r => r.slice());
    const own = new Set(cells.map(([r, c]) => (row + r) * SIZE + col + c));
    let contacts = 0;
    for (const [r, c] of cells) {
      const rr = row + r, cc = col + c;
      next[rr][cc] = 1;
      for (const [dr, dc] of [[1,0],[-1,0],[0,1],[0,-1]]) {
        const nr = rr + dr, nc = cc + dc;
        if (nr < 0 || nr >= SIZE || nc < 0 || nc >= SIZE) contacts++;
        else if (g[nr][nc] && !own.has(nr * SIZE + nc)) contacts++;
      }
    }
    const fullRows = [], fullCols = [];
    for (let r = 0; r < SIZE; r++) if (next[r].every(Boolean)) fullRows.push(r);
    for (let c = 0; c < SIZE; c++) if (next.every(rowArr => rowArr[c])) fullCols.push(c);
    fullRows.forEach(r => next[r].fill(null));
    fullCols.forEach(c => next.forEach(rowArr => { rowArr[c] = null; }));
    return { grid: next, lines: fullRows.length + fullCols.length, contacts };
  }

  function bestMove(g, cells) {
    let best = null;
    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        if (!canPlaceOn(g, cells, r, c)) continue;
        const move = simulateMove(g, cells, r, c);
        const value = move.lines * 100 + move.contacts;
        if (!best || value > best.value) best = { ...move, value };
      }
    }
    return best;
  }

  const ORDERS = [[0,1,2],[0,2,1],[1,0,2],[1,2,0],[2,0,1],[2,1,0]];

  // Rates a hand: -Infinity if no order lets all three pieces fit,
  // otherwise more for cleared lines and for free space left afterwards.
  function rateHand(hand) {
    let best = -Infinity;
    for (const order of ORDERS) {
      let g = grid, lines = 0, ok = true;
      for (const i of order) {
        const move = bestMove(g, hand[i].cells);
        if (!move) { ok = false; break; }
        g = move.grid;
        lines += move.lines;
      }
      if (!ok) continue;
      const empty = g.reduce((n, rowArr) => n + rowArr.filter(x => !x).length, 0);
      best = Math.max(best, lines * 10 + empty * 0.3);
    }
    return best;
  }

  // Difficulty ramp: 0 at the start of a round, rising with every hand so each round ends eventually.
  const PRESSURE = { endless: [8, 30], daily: [6, 25], level: [12, 25] };   // [first hand, hands to full pressure]
  const MAX_PRESSURE = 0.85;
  function pressure() {
    const [start, span] = PRESSURE[mode];
    return Math.min(MAX_PRESSURE, Math.max(0, (handsDealt - start) / span));
  }

  // Chance that the next hand is guaranteed to fit completely.
  function fairChance() {
    if (handsDealt < 3) return 1;      // a friendly start
    const filled = grid.reduce((n, rowArr) => n + rowArr.filter(Boolean).length, 0) / (SIZE * SIZE);
    let chance = mode === 'endless' ? 0.3 : 0.45;
    if (filled > 0.5) chance += 0.3;   // a lifeline when the board gets crowded
    return chance * (1 - pressure());
  }

  const LUCKY_SAMPLES = 25;
  const HARD_SAMPLES = 6;
  const FAIR_TRIES = 20;
  const randomPiece = () => ({ cells: randomShape(), color: COLORS[Math.floor(rand() * COLORS.length)] });
  const randomHand = () => [randomPiece(), randomPiece(), randomPiece()];

  function sampleHand(samples, better) {
    let best = null, bestRating = 0;
    for (let i = 0; i < samples; i++) {
      const hand = randomHand();
      const rating = rateHand(hand);
      if (!best || better(rating, bestRating)) { best = hand; bestRating = rating; }
    }
    return best;
  }

  function pickHand() {
    if (luckyHands > 0) return sampleHand(LUCKY_SAMPLES, (a, b) => a > b);
    if (rand() < pressure()) return sampleHand(HARD_SAMPLES, (a, b) => a < b);
    if (rand() < fairChance()) {
      for (let i = 0; i < FAIR_TRIES; i++) {
        const hand = randomHand();
        if (rateHand(hand) > -Infinity) return hand;
      }
    }
    return randomHand();
  }

  function dealPieces() {
    pieces = pickHand();
    // Whatever was picked, at least one piece must fit so a fresh hand is never instantly lost.
    if (!pieces.some(p => fitsAnywhere(p.cells))) {
      for (let tries = 0; tries < 50; tries++) {
        const cells = randomShape();
        if (fitsAnywhere(cells)) { pieces[0].cells = cells; break; }
      }
    }
    handsDealt++;
    if (luckyHands > 0) luckyHands--;
    renderLuck();
  }

  // ---------- Rewarded ads (placeholder) ----------
  const LUCK_HANDS = 3;
  const LUCK_COOLDOWN = 5;   // hands between two luck boosts

  function renderLuck() {
    const btn = $('btn-luck');
    btn.classList.toggle('active', luckyHands > 0);
    if (luckyHands > 0) {
      btn.disabled = true;
      btn.textContent = `🍀 Glück aktiv · noch ${luckyHands} ${luckyHands === 1 ? 'Runde' : 'Runden'}`;
    } else if (handsDealt < luckReadyAt) {
      btn.disabled = true;
      const wait = luckReadyAt - handsDealt;
      btn.textContent = `🍀 Wieder verfügbar in ${wait} ${wait === 1 ? 'Runde' : 'Runden'}`;
    } else {
      btn.disabled = false;
      btn.textContent = '🍀 Bessere Steine · Werbung ansehen';
    }
  }

  // Shows the ad placeholder, counts down, then hands out the reward.
  // In a published game this would call the ad SDK's rewarded ad instead.
  function showAd(rewardText, onReward) {
    $('ad-reward').textContent = `Belohnung: ${rewardText}`;
    $('btn-ad-done').hidden = true;
    showDialog('dlg-ad');
    let left = 3;
    $('ad-count').textContent = left;
    const timer = setInterval(() => {
      left--;
      $('ad-count').textContent = Math.max(left, 0);
      if (left <= 0) {
        clearInterval(timer);
        $('btn-ad-done').hidden = false;
        $('btn-ad-done').onclick = () => {
          sfx.click();
          save('klotz-ads-watched', load('klotz-ads-watched', 0) + 1);
          overlay.classList.remove('show');
          onReward();
        };
      }
    }, 1000);
  }

  function activateLuck() {
    if (over || busy || luckyHands > 0 || handsDealt < luckReadyAt) return;
    showAd(`${LUCK_HANDS} Runden lang die besten Steine`, () => {
      luckyHands = LUCK_HANDS;
      luckReadyAt = handsDealt + LUCK_HANDS + LUCK_COOLDOWN;
      // Swap the current hand right away so the reward is felt immediately.
      dealPieces();
      renderTray();
      confetti();
      toast('🍀 Glück aktiv!', 2000);
    });
  }

  // ---------- Rendering ----------
  function renderBoard() {
    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        const i = r * SIZE + c;
        const el = cellEls[i];
        el.className = 'cell';
        el.style.backgroundColor = '';
        if (grid[r][c]) {
          el.classList.add('block');
          el.style.backgroundColor = grid[r][c];
          if (justPlaced.has(i)) el.classList.add('placed');
        }
      }
    }
  }

  function buildPieceEl(piece, cellSize, gap) {
    const rows = Math.max(...piece.cells.map(([r]) => r)) + 1;
    const cols = Math.max(...piece.cells.map(([, c]) => c)) + 1;
    const el = document.createElement('div');
    el.className = 'piece';
    el.style.gridTemplateColumns = `repeat(${cols}, ${cellSize}px)`;
    el.style.gridTemplateRows = `repeat(${rows}, ${cellSize}px)`;
    el.style.gap = gap + 'px';
    for (const [r, c] of piece.cells) {
      const b = document.createElement('div');
      b.className = 'block';
      b.style.backgroundColor = piece.color;
      b.style.gridRow = r + 1;
      b.style.gridColumn = c + 1;
      el.appendChild(b);
    }
    return el;
  }

  function renderTray() {
    trayEl.innerHTML = '';
    pieces.forEach((p, i) => {
      const slot = document.createElement('div');
      slot.className = 'slot';
      if (p) {
        const el = buildPieceEl(p, 20, 2);
        if (!fitsAnywhere(p.cells)) el.classList.add('unfit');
        el.addEventListener('pointerdown', e => startDrag(e, i, el));
        slot.appendChild(el);
      }
      trayEl.appendChild(slot);
    });
  }

  const goalLines = () => mode === 'level' ? LEVELS[level].lines : DAILY_LINES;

  function renderHud() {
    scoreEl.textContent = score;
    if (mode === 'endless') {
      if (score > best) { best = score; save('klotz-best', best); }
      bestEl.textContent = best;
      statusEl.textContent = 'Endlos';
    } else {
      const goal = goalLines();
      const name = mode === 'daily' ? 'Tages-Challenge' : `Level ${level + 1}`;
      statusEl.textContent = `${name} · ${Math.min(lines, goal)}/${goal} Linien`;
      $('goal-fill').style.width = Math.min(100, (lines / goal) * 100) + '%';
    }
  }

  function bumpScore() {
    scoreEl.classList.remove('bump');
    void scoreEl.offsetWidth;
    scoreEl.classList.add('bump');
  }

  // ---------- Drag & drop ----------
  let drag = null;

  function boardMetrics() {
    const rect = boardEl.getBoundingClientRect();
    const pad = 6, gap = 3;
    const cell = (rect.width - pad * 2 - gap * (SIZE - 1)) / SIZE;
    return { rect, pad, gap, cell };
  }

  function startDrag(e, index, sourceEl) {
    if (busy || over) return;
    e.preventDefault();
    sfx.pick();
    justPlaced = new Set();
    const m = boardMetrics();
    const piece = pieces[index];
    const el = buildPieceEl(piece, m.cell, m.gap);
    dragEl.innerHTML = '';
    dragEl.appendChild(el);
    const w = el.offsetWidth, h = el.offsetHeight;
    // Lift the piece above the finger so it stays visible on touch screens.
    const lift = e.pointerType === 'touch' ? h + 40 : h / 2;
    drag = { index, piece, sourceEl, w, h, lift, target: null };
    sourceEl.classList.add('hidden');
    moveDrag(e);
    window.addEventListener('pointermove', moveDrag);
    window.addEventListener('pointerup', endDrag);
    window.addEventListener('pointercancel', endDrag);
  }

  function moveDrag(e) {
    if (!drag) return;
    const x = e.clientX - drag.w / 2;
    const y = e.clientY - drag.lift;
    dragEl.style.transform = `translate(${x}px, ${y}px)`;

    const m = boardMetrics();
    const step = m.cell + m.gap;
    const col = Math.round((x - m.rect.left - m.pad) / step);
    const row = Math.round((y - m.rect.top - m.pad) / step);
    drag.target = canPlace(drag.piece.cells, row, col) ? { row, col } : null;
    showGhost();
  }

  function showGhost() {
    renderBoard();
    if (!drag || !drag.target) return;
    const { row, col } = drag.target;
    for (const [r, c] of drag.piece.cells) cellEls[(row + r) * SIZE + col + c].classList.add('ghost');
    // Highlight rows/columns that this placement would complete.
    const filled = new Set(drag.piece.cells.map(([r, c]) => (row + r) * SIZE + col + c));
    const isFull = (r, c) => grid[r][c] || filled.has(r * SIZE + c);
    for (let r = 0; r < SIZE; r++) {
      if ([...Array(SIZE).keys()].every(c => isFull(r, c)))
        for (let c = 0; c < SIZE; c++) cellEls[r * SIZE + c].classList.add('will-clear');
    }
    for (let c = 0; c < SIZE; c++) {
      if ([...Array(SIZE).keys()].every(r => isFull(r, c)))
        for (let r = 0; r < SIZE; r++) cellEls[r * SIZE + c].classList.add('will-clear');
    }
  }

  function endDrag(e) {
    window.removeEventListener('pointermove', moveDrag);
    window.removeEventListener('pointerup', endDrag);
    window.removeEventListener('pointercancel', endDrag);
    dragEl.innerHTML = '';
    if (!drag) return;
    const { index, piece, sourceEl, target } = drag;
    drag = null;
    if (target) {
      place(index, piece, target.row, target.col);
    } else {
      // Only buzz when the piece was dropped over the board, not when the player just let go in the tray.
      const rect = boardEl.getBoundingClientRect();
      if (e.type === 'pointerup' && e.clientY < rect.bottom) sfx.invalid();
      sourceEl.classList.remove('hidden');
      renderBoard();
    }
  }

  // ---------- Game logic ----------
  function place(index, piece, row, col) {
    const placedIdx = piece.cells.map(([r, c]) => (row + r) * SIZE + col + c);
    for (const [r, c] of piece.cells) grid[row + r][col + c] = piece.color;
    justPlaced = new Set(placedIdx);
    pieces[index] = null;
    score += piece.cells.length;

    const fullRows = [], fullCols = [];
    for (let r = 0; r < SIZE; r++) if (grid[r].every(Boolean)) fullRows.push(r);
    for (let c = 0; c < SIZE; c++) if (grid.every(rowArr => rowArr[c])) fullCols.push(c);
    const cleared = fullRows.length + fullCols.length;

    renderBoard();
    for (const i of placedIdx) { const [x, y] = cellCenter(i); burst(x, y, piece.color, 3, 2); }

    if (cleared > 0) {
      combo++;
      lines += cleared;
      addStats({ lines: cleared });
      // More lines at once and longer streaks are worth disproportionately more.
      const gained = cleared * 10 * cleared * combo;
      score += gained;
      flashCombo(cleared, combo);
      sfx.clear(cleared, combo);
      bumpScore();

      const toClear = new Set();
      fullRows.forEach(r => { for (let c = 0; c < SIZE; c++) toClear.add(r * SIZE + c); });
      fullCols.forEach(c => { for (let r = 0; r < SIZE; r++) toClear.add(r * SIZE + c); });
      toClear.forEach(i => {
        cellEls[i].classList.add('clearing');
        const [x, y] = cellCenter(i);
        burst(x, y, grid[Math.floor(i / SIZE)][i % SIZE], 7, 4 + cleared);
      });
      const [fx0, fy0] = cellCenter(placedIdx[0]);
      floatText(`+${gained}`, fx0, fy0, 22 + Math.min(cleared * 4, 16));
      if (cleared > 1 || combo > 2) shakeBoard();

      busy = true;
      setTimeout(() => {
        toClear.forEach(i => { grid[Math.floor(i / SIZE)][i % SIZE] = null; });
        busy = false;
        afterMove();
      }, 350);
    } else {
      combo = 0;
      sfx.place();
      afterMove();
    }
    renderHud();
  }

  function afterMove() {
    if (pieces.every(p => !p)) dealPieces();
    renderBoard();
    renderTray();
    if (mode !== 'endless' && lines >= goalLines()) return winRound();
    if (!pieces.some(p => p && fitsAnywhere(p.cells))) gameOver();
  }

  const PRAISE = ['Super!', 'Klasse!', 'Wow!', 'Genial!', 'Mega!', 'Unglaublich!'];
  let comboTimer;
  function flashCombo(cleared, streak) {
    const parts = [];
    if (cleared > 1 || streak > 1) parts.push(PRAISE[Math.min(cleared + streak - 2, PRAISE.length - 1)]);
    if (cleared > 1) parts.push(`${cleared} Linien`);
    if (streak > 1) parts.push(`Combo x${streak}`);
    if (!parts.length) parts.push('Linie!');
    comboEl.textContent = parts.join('  ·  ');
    comboEl.style.opacity = 1;
    comboEl.classList.remove('pop');
    void comboEl.offsetWidth;
    comboEl.classList.add('pop');
    clearTimeout(comboTimer);
    comboTimer = setTimeout(() => { comboEl.style.opacity = 0; }, 1300);
  }

  function showDialog(id) {
    for (const d of ['dlg-pause', 'dlg-over', 'dlg-win', 'dlg-ad']) $(d).hidden = d !== id;
    overlay.classList.add('show');
  }

  function gameOver() {
    over = true;
    sfx.gameOver();
    const goalText = `${lines} von ${goalLines()} Linien`;
    $('over-text').textContent =
      mode === 'endless' ? `Punkte: ${score}` :
      mode === 'daily' ? `Tages-Challenge: ${goalText}` :
      `Level ${level + 1}: ${goalText}`;
    const left = MAX_RESCUES - rescues;
    $('btn-revive').hidden = left <= 0;
    $('revive-info').textContent = `Werbung ansehen · noch ${left}× möglich`;
    setTimeout(() => showDialog('dlg-over'), 400);
  }

  // 1 star for finishing, more for a high score relative to the goal.
  function starsFor(points, goal) {
    if (points >= goal * 40) return 3;
    if (points >= goal * 25) return 2;
    return 1;
  }

  function winRound() {
    over = true;
    const stars = starsFor(score, goalLines());
    $('win-streak').hidden = true;

    if (mode === 'level') {
      const unlocked = load('klotz-unlocked', 1);
      if (level + 2 > unlocked) save('klotz-unlocked', Math.min(level + 2, LEVELS.length));
      const allStars = load('klotz-stars', {});
      allStars[level] = Math.max(allStars[level] || 0, stars);
      save('klotz-stars', allStars);
      const last = level === LEVELS.length - 1;
      $('win-title').textContent = last ? 'Alle Level geschafft!' : 'Level geschafft!';
      $('win-text').textContent = `Level ${level + 1} mit ${score} Punkten`;
      $('btn-next').hidden = last;
    } else {
      const d = dailyState();
      const today = todayKey();
      if (d.last !== today) { d.streak += 1; d.last = today; }
      d.stars = { [today]: Math.max(d.stars?.[today] || 0, stars) };
      save('klotz-daily', d);
      const s = loadStats();
      if (d.streak > s.bestStreak) save('klotz-stats', { ...s, bestStreak: d.streak });
      $('win-title').textContent = 'Tages-Challenge geschafft!';
      $('win-text').textContent = `${score} Punkte. Morgen gibt es ein neues Feld.`;
      $('win-streak').textContent = d.streak > 1 ? `🔥 ${d.streak} Tage in Folge` : '🔥 Deine erste Serie beginnt';
      $('win-streak').hidden = false;
      $('btn-next').hidden = true;
    }

    [...$('win-stars').children].forEach((s, i) => s.classList.toggle('on', i < stars));
    setTimeout(() => {
      sfx.win();
      for (let i = 0; i < stars; i++) setTimeout(() => sfx.star(i), 600 + i * 250);
      confetti();
      showDialog('dlg-win');
    }, 400);
  }

  // Rescue (after a rewarded ad): wipe the middle four rows and deal lucky hands.
  // The difficulty ramp keeps going, so a rescued round still ends at some point.
  function rescue() {
    if (rescues >= MAX_RESCUES) return;
    showAd('Feld wird frei und 2 Runden lang die besten Steine', () => {
      rescues++;
      over = false;
      for (let r = 2; r < 6; r++) grid[r].fill(null);
      luckyHands = 2;
      dealPieces();
      renderBoard();
      renderTray();
      confetti();
      toast('Gerettet! Weiter geht’s 🍀', 2000);
    });
  }

  // The daily board: a handful of stones placed from today's seed, never forming a full line.
  function dailyLayout() {
    const count = 8 + Math.floor(rand() * 7);
    for (let n = 0; n < count; n++) {
      const r = Math.floor(rand() * SIZE), c = Math.floor(rand() * SIZE);
      grid[r][c] = STONE;
      if (grid[r].every(Boolean) || grid.every(row => row[c])) grid[r][c] = null;
    }
  }

  function startGame(newMode, levelIndex = 0) {
    mode = newMode;
    level = levelIndex;
    rand = mode === 'daily' ? seededRandom(hashString('klotz-' + todayKey())) : Math.random;
    grid = Array.from({ length: SIZE }, () => Array(SIZE).fill(null));
    if (mode === 'level') {
      LEVELS[level].map.forEach((line, r) => {
        [...line].forEach((ch, c) => { if (ch === '#') grid[r][c] = STONE; });
      });
    } else if (mode === 'daily') {
      dailyLayout();
    }
    score = 0; combo = 0; lines = 0; rescues = 0; busy = false; over = false;
    justPlaced = new Set();
    luckyHands = 0; handsDealt = 0; luckReadyAt = 0;
    best = load('klotz-best', 0);
    addStats({ games: 1 });
    $('goal').hidden = mode === 'endless';
    $('best-row').hidden = mode !== 'endless';
    showScreen('screen-game');
    dealPieces();
    renderBoard();
    renderTray();
    renderHud();
  }

  // Leaving a round goes back to where the player came from.
  const homeFor = () => mode === 'level' ? 'screen-levels' : 'screen-home';

  // ---------- Wiring ----------
  const on = (id, fn) => $(id).addEventListener('click', () => { sfx.click(); fn(); });

  on('btn-play', () => showScreen('screen-home'));
  on('btn-daily', () => startGame('daily'));
  on('btn-endless', () => startGame('endless'));
  on('btn-levels', () => showScreen('screen-levels'));
  on('btn-stats', () => showScreen('screen-stats'));
  on('btn-settings', () => showScreen('screen-settings'));
  document.querySelectorAll('[data-back]').forEach(b =>
    b.addEventListener('click', () => { sfx.click(); showScreen(b.dataset.back); }));

  on('set-sound', () => setMuted(!muted));
  on('set-music', () => setMusic(!musicOn));
  on('set-calm', () => { calm = !calm; save('klotz-calm', calm); renderSettings(); updateBackground(); });
  on('btn-reset', () => { $('reset-confirm').hidden = false; });
  on('btn-reset-no', () => { $('reset-confirm').hidden = true; });
  on('btn-reset-yes', () => {
    try { STORAGE_KEYS.forEach(k => localStorage.removeItem(k)); } catch {}
    $('reset-confirm').hidden = true;
    toast('Fortschritt gelöscht', 2000);
  });

  on('btn-pause', () => { if (!over) showDialog('dlg-pause'); });
  on('btn-resume', () => overlay.classList.remove('show'));
  on('btn-pause-sound', () => setMuted(!muted));
  on('btn-pause-music', () => setMusic(!musicOn));
  on('btn-restart', () => startGame(mode, level));
  on('btn-pause-home', () => showScreen(homeFor()));

  on('btn-luck', activateLuck);
  on('btn-revive', rescue);
  on('btn-retry', () => startGame(mode, level));
  on('btn-over-home', () => showScreen(homeFor()));
  on('btn-next', () => startGame('level', level + 1));
  on('btn-win-retry', () => startGame(mode, level));
  on('btn-win-home', () => showScreen(homeFor()));

  buildLogo();
  renderTitle();
  renderSettings();
  showScreen('screen-title');
})();
</script>
</body>
</html>
