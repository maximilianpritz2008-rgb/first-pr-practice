<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Klotz Kaskade</title>
<style>
  :root {
    --bg: #1b1235;
    --panel: rgba(42, 28, 82, 0.85);
    --panel-solid: #2a1c52;
    --cell: #34265f;
    --cell-line: #46377a;
    --text: #fbf7ff;
    --muted: #c4b6ec;
    --accent: #ffd60a;
    --button: #5b47a8;
    --danger: #ff4d6d;
    --ghost-ok: rgba(255, 255, 255, 0.4);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%;
    background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    overscroll-behavior: none; user-select: none;
  }
  #bg { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }

  /* ---------- Screens ---------- */
  .screen {
    position: relative; z-index: 1;
    max-width: 480px; margin: 0 auto; padding: 16px;
    min-height: 100%;
    display: flex; flex-direction: column; align-items: center; gap: 12px;
  }
  .screen.enter { animation: screen-in 0.3s ease-out; }
  @keyframes screen-in { from { opacity: 0; transform: translateY(16px); } }
  .topbar { width: 100%; display: flex; align-items: center; gap: 10px; }
  .topbar h2 { margin: 0; font-size: 22px; flex: 1; }
  .icon-btn {
    width: 40px; height: 40px; margin: 0; padding: 0; border-radius: 12px; flex: none;
    background: var(--panel); color: var(--text); font-size: 18px;
  }

  /* Title screen */
  #screen-title { justify-content: center; gap: 28px; }
  .logo { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .logo-row { display: flex; gap: 6px; }
  .logo-tile {
    width: clamp(44px, 14vw, 62px); height: clamp(44px, 14vw, 62px);
    display: flex; align-items: center; justify-content: center;
    font-size: clamp(26px, 8.5vw, 38px); font-weight: 900; color: #fff;
    border-radius: 12px; text-shadow: 0 2px 0 rgba(0,0,0,0.25);
    background-image: linear-gradient(180deg, rgba(255,255,255,0.4), rgba(255,255,255,0) 55%);
    box-shadow: inset 0 -5px 0 rgba(0,0,0,0.25), inset 0 3px 0 rgba(255,255,255,0.45), 0 6px 18px rgba(0,0,0,0.3);
    animation: tile-drop 0.6s cubic-bezier(.3,1.6,.6,1) backwards, tile-bob 3s ease-in-out infinite;
  }
  @keyframes tile-drop { from { transform: translateY(-120vh) rotate(-20deg); } }
  @keyframes tile-bob { 50% { transform: translateY(-5px); } }
  .logo-sub {
    font-size: clamp(22px, 7vw, 30px); font-weight: 900; letter-spacing: 8px;
    background: linear-gradient(90deg, #ff4d6d, #ffd60a, #38e54d, #00c2ff, #c86bff);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    animation: fade-in 0.6s 0.9s ease-out backwards;
  }
  @keyframes fade-in { from { opacity: 0; transform: scale(0.8); } }
  .title-actions { width: min(300px, 100%); display: flex; flex-direction: column; gap: 12px; animation: fade-in 0.5s 1.1s backwards; }
  .play-btn { font-size: 22px; padding: 18px; animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 50% { transform: scale(1.05); box-shadow: 0 0 30px rgba(255, 214, 10, 0.6); } }
  .pill {
    align-self: center; padding: 6px 14px; border-radius: 999px; background: var(--panel);
    font-size: 14px; font-weight: 700;
  }

  /* Home screen */
  .home-title {
    margin: 4px 0 0; font-size: 26px; font-weight: 900; text-align: center;
    background: linear-gradient(90deg, #ff4d6d, #ffd60a, #38e54d, #00c2ff, #c86bff);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .mode-card {
    width: 100%; margin: 0; padding: 18px; border-radius: 18px; text-align: left;
    display: flex; align-items: center; gap: 14px; color: #fff;
    box-shadow: inset 0 -5px 0 rgba(0,0,0,0.2), 0 8px 24px rgba(0,0,0,0.25);
    transition: transform 0.15s;
  }
  .mode-card:active { transform: scale(0.97); }
  .mode-card .emoji { font-size: 36px; flex: none; }
  .mode-card .txt { flex: 1; min-width: 0; }
  .mode-card .name { font-size: 20px; font-weight: 900; display: block; text-shadow: 0 1px 0 rgba(0,0,0,0.25); }
  .mode-card .info { font-size: 13px; font-weight: 600; opacity: 0.92; display: block; margin-top: 3px; }
  .card-daily { background: linear-gradient(135deg, #ff4d6d, #ff9f1c); }
  .card-endless { background: linear-gradient(135deg, #00a6ff, #8f5bff); }
  .card-levels { background: linear-gradient(135deg, #1fbf5a, #00b3a4); }
  .card-shop { background: linear-gradient(135deg, #ff4fd8, #8f5bff); }
  .home-head { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .coin-pill {
    padding: 6px 12px; border-radius: 999px; background: var(--panel); flex: none;
    font-weight: 800; color: var(--accent); font-variant-numeric: tabular-nums;
  }
  .home-nav { width: 100%; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: auto; }
  .home-nav button { margin: 0; }

  /* Level map */
  .map { width: 100%; display: flex; flex-direction: column-reverse; gap: 14px; padding: 8px 0 24px; position: relative; }
  .map::before {
    content: ""; position: absolute; left: 50%; top: 20px; bottom: 40px; width: 6px; margin-left: -3px;
    background: repeating-linear-gradient(180deg, var(--muted) 0 10px, transparent 10px 20px); opacity: 0.35;
  }
  .map-row { display: flex; position: relative; }
  .map-row:nth-child(4n+1) { justify-content: center; }
  .map-row:nth-child(4n+2) { justify-content: flex-start; padding-left: 12%; }
  .map-row:nth-child(4n+3) { justify-content: center; }
  .map-row:nth-child(4n+4) { justify-content: flex-end; padding-right: 12%; }
  .level-node {
    width: 76px; height: 76px; margin: 0; padding: 0; border-radius: 50%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-size: 26px; font-weight: 900; color: #fff;
    background: linear-gradient(180deg, #9b7bff, #5b47a8);
    box-shadow: inset 0 -5px 0 rgba(0,0,0,0.25), 0 6px 16px rgba(0,0,0,0.35);
  }
  .level-node small { font-size: 12px; letter-spacing: -1px; color: var(--accent); }
  .level-node.done { background: linear-gradient(180deg, #ffd60a, #ff9f1c); color: #4a2a00; }
  .level-node.done small { color: #7a3d00; }
  .level-node.current { animation: pulse 1.6s ease-in-out infinite; background: linear-gradient(180deg, #38e54d, #1f9e3a); }
  .level-node:disabled { background: #3a2f63; color: #6d6491; cursor: default; }
  .stars-total { font-weight: 800; color: var(--accent); }

  /* Shop */
  .tabs { width: 100%; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .tabs button { margin: 0; padding: 10px; background: var(--panel); color: var(--muted); }
  .tabs button[aria-selected="true"] { background: var(--button); color: var(--text); }
  .shop-grid { width: 100%; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .shop-item {
    display: flex; flex-direction: column; gap: 8px; padding: 10px; border-radius: 16px;
    background: var(--panel); text-align: center; min-width: 0;
  }
  .shop-item.selected { box-shadow: 0 0 0 3px var(--accent); }
  .shop-item .name { font-weight: 800; }
  .shop-item button { margin: 0; padding: 10px; font-size: 14px; }
  .shop-item button:disabled { opacity: 0.5; cursor: default; }
  .preview-blocks {
    height: 92px; border-radius: 10px; background: var(--cell);
    display: grid; grid-template-columns: repeat(4, 18px); grid-auto-rows: 18px; gap: 3px;
    align-content: center; justify-content: center;
  }
  .preview-bg { width: 100%; height: 92px; border-radius: 10px; display: block; }
  .free-coins { width: 100%; margin: 0; }

  /* Stats & settings */
  .list { width: 100%; display: flex; flex-direction: column; gap: 10px; }
  .row {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 14px 16px; border-radius: 14px; background: var(--panel);
  }
  .row .label { color: var(--muted); }
  .row .value { font-size: 20px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .toggle {
    width: 54px; height: 32px; margin: 0; padding: 0; border-radius: 999px; flex: none; position: relative;
    background: #4b3f78;
  }
  .toggle::after {
    content: ""; position: absolute; top: 4px; left: 4px; width: 24px; height: 24px; border-radius: 50%;
    background: #fff; transition: transform 0.2s;
  }
  .toggle[aria-checked="true"] { background: #38e54d; }
  .toggle[aria-checked="true"]::after { transform: translateX(22px); }
  .danger { background: var(--danger); color: #fff; }
  .confirm-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .confirm-row button { margin: 0; }

  /* ---------- Game screen ---------- */
  /* No scrolling or zooming while dragging pieces; menu screens stay scrollable. */
  #screen-game { touch-action: none; }
  header { width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .hud-left { display: flex; align-items: center; gap: 10px; min-width: 0; }
  #status { font-size: 14px; color: var(--muted); font-weight: 600; }
  .scores { text-align: right; }
  .score { font-size: 32px; font-weight: 800; color: var(--accent); line-height: 1; text-shadow: 0 0 18px rgba(255, 214, 10, 0.5); }
  .score.bump { animation: bump 0.3s ease-out; }
  @keyframes bump { 50% { transform: scale(1.25); } }
  .best { font-size: 13px; color: var(--muted); margin-top: 4px; }
  #goal { width: 100%; height: 10px; background: var(--panel); border-radius: 5px; overflow: hidden; }
  #goal-fill {
    height: 100%; width: 0; transition: width 0.3s;
    background: linear-gradient(90deg, #ff4d6d, #ffd60a, #38e54d, #00c2ff);
  }
  #combo {
    height: 28px; font-size: 20px; font-weight: 900; opacity: 0;
    background: linear-gradient(90deg, #ff4d6d, #ffd60a, #38e54d, #00c2ff, #c86bff, #ff4d6d);
    background-size: 200% 100%;
    -webkit-background-clip: text; background-clip: text; color: transparent;
    animation: rainbow 1.2s linear infinite;
  }
  #combo.pop { animation: rainbow 1.2s linear infinite, combo-pop 0.4s ease-out; }
  @keyframes rainbow { to { background-position: 200% 0; } }
  @keyframes combo-pop { 0% { transform: scale(0.5); } 60% { transform: scale(1.3); } 100% { transform: scale(1); } }
  #board {
    --size: min(calc(100vw - 32px), 420px);
    width: var(--size); height: var(--size);
    display: grid; grid-template-columns: repeat(8, 1fr); gap: 3px;
    padding: 6px; background: var(--panel); border-radius: 14px;
    box-shadow: 0 0 40px rgba(140, 90, 255, 0.35);
  }
  #board.shake { animation: shake 0.35s ease-out; }
  @keyframes shake {
    20% { transform: translate(-6px, 3px) rotate(-0.6deg); }
    40% { transform: translate(5px, -4px) rotate(0.5deg); }
    60% { transform: translate(-4px, 2px); }
    80% { transform: translate(2px, -1px); }
  }
  .cell { background: var(--cell); border-radius: 5px; box-shadow: inset 0 0 0 1px var(--cell-line); }
  .block {
    border-radius: 5px;
    background-image: linear-gradient(180deg, rgba(255,255,255,0.4), rgba(255,255,255,0) 55%);
    box-shadow: inset 0 -4px 0 rgba(0,0,0,0.25), inset 0 2px 0 rgba(255,255,255,0.45), 0 0 10px rgba(255,255,255,0.12);
  }
  .cell.bush {
    border-radius: 9px;
    background-color: #2f9e44;
    background-image:
      radial-gradient(circle at 30% 34%, #8ce99a 0 15%, transparent 16%),
      radial-gradient(circle at 68% 28%, #b2f2bb 0 12%, transparent 13%),
      radial-gradient(circle at 50% 58%, #69db7c 0 24%, transparent 25%),
      radial-gradient(circle at 20% 72%, #51cf66 0 17%, transparent 18%),
      radial-gradient(circle at 80% 70%, #51cf66 0 18%, transparent 19%);
    box-shadow: inset 0 -5px 0 #1e6b34, inset 0 2px 0 rgba(255,255,255,0.3), 0 0 8px rgba(81, 207, 102, 0.25);
  }
  .cell.bush.thorny {
    background-color: #1e6b34;
    background-image:
      radial-gradient(circle at 28% 30%, #ff4d6d 0 8%, transparent 9%),
      radial-gradient(circle at 72% 40%, #ff4d6d 0 8%, transparent 9%),
      radial-gradient(circle at 46% 72%, #ff4d6d 0 8%, transparent 9%),
      radial-gradient(circle at 30% 34%, #51cf66 0 16%, transparent 17%),
      radial-gradient(circle at 68% 30%, #69db7c 0 14%, transparent 15%),
      radial-gradient(circle at 50% 60%, #40c057 0 25%, transparent 26%),
      radial-gradient(circle at 80% 74%, #2f9e44 0 18%, transparent 19%);
    box-shadow: inset 0 -5px 0 #0f3d1d, inset 0 0 0 2px #0f3d1d, 0 0 8px rgba(255, 77, 109, 0.3);
  }
  .cell.hit { animation: hit 0.35s ease-out; }
  @keyframes hit {
    30% { transform: scale(0.8) rotate(-8deg); filter: brightness(1.8); }
    60% { transform: scale(1.1) rotate(6deg); }
  }
  .cell.placed { animation: land 0.3s ease-out; }
  /* Block skins: set on the board, the tray, the dragged piece and shop previews. */
  [data-skin="candy"] .block {
    border-radius: 10px;
    background-image: repeating-linear-gradient(135deg, rgba(255,255,255,0.5) 0 4px, transparent 4px 10px),
      linear-gradient(180deg, rgba(255,255,255,0.35), transparent 60%);
    box-shadow: inset 0 -4px 0 rgba(0,0,0,0.15), 0 0 8px rgba(255,255,255,0.15);
  }
  [data-skin="neon"] .block {
    background-color: rgba(12, 6, 32, 0.92) !important; background-image: none;
    box-shadow: inset 0 0 0 2px var(--c), inset 0 0 10px var(--c), 0 0 10px var(--c);
  }
  [data-skin="gems"] .block {
    border-radius: 4px;
    background-image: conic-gradient(from 45deg, rgba(255,255,255,0.55), rgba(0,0,0,0.3) 25%, rgba(255,255,255,0.25) 50%, rgba(0,0,0,0.4) 75%, rgba(255,255,255,0.55));
    box-shadow: inset 0 0 0 3px rgba(255,255,255,0.25), 0 0 10px rgba(255,255,255,0.2);
  }
  @keyframes land { 0% { transform: scale(1.25); filter: brightness(1.8); } 100% { transform: scale(1); } }
  .cell.ghost { background: var(--ghost-ok); }
  .cell.will-clear { filter: brightness(1.6) saturate(1.3); }
  .cell.clearing { animation: pop 0.35s ease-out forwards; }
  @keyframes pop {
    0% { transform: scale(1); }
    50% { transform: scale(1.2); filter: brightness(2.2); }
    100% { transform: scale(0) rotate(30deg); opacity: 0; }
  }
  #tray {
    width: 100%; min-height: 130px;
    display: grid; grid-template-columns: repeat(3, 1fr); align-items: center; justify-items: center;
  }
  .slot { width: 100%; height: 120px; display: flex; align-items: center; justify-content: center; }
  .piece { display: grid; gap: 2px; cursor: grab; touch-action: none; animation: deal 0.35s ease-out backwards; }
  .slot:nth-child(2) .piece { animation-delay: 0.06s; }
  .slot:nth-child(3) .piece { animation-delay: 0.12s; }
  @keyframes deal { from { transform: translateY(30px) scale(0.6); opacity: 0; } }
  .piece.unfit { opacity: 0.35; }
  .piece.hidden { visibility: hidden; }
  #drag { position: fixed; left: 0; top: 0; pointer-events: none; z-index: 10; display: grid; gap: 3px; filter: drop-shadow(0 8px 12px rgba(0,0,0,0.4)); }
  #fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 30; }
  .floater {
    position: fixed; z-index: 31; pointer-events: none; font-weight: 900; font-size: 24px;
    color: var(--accent); text-shadow: 0 2px 0 rgba(0,0,0,0.35), 0 0 12px rgba(255, 214, 10, 0.6);
    transform: translate(-50%, -50%); animation: float-up 0.9s ease-out forwards;
  }
  @keyframes float-up {
    0% { opacity: 0; transform: translate(-50%, -30%) scale(0.6); }
    20% { opacity: 1; transform: translate(-50%, -60%) scale(1.15); }
    100% { opacity: 0; transform: translate(-50%, -160%) scale(1); }
  }
  #btn-luck {
    width: auto; margin: 0; padding: 10px 18px; border-radius: 999px; font-size: 14px;
    background: linear-gradient(135deg, #38e54d, #00c2ff); color: #062a12;
  }
  #btn-luck:disabled { background: var(--panel); color: var(--muted); cursor: default; }
  #btn-luck.active { animation: glow 1.4s ease-in-out infinite; }
  @keyframes glow { 50% { box-shadow: 0 0 22px rgba(56, 229, 77, 0.8); } }
  #toast {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 40;
    background: var(--panel-solid); color: var(--text); padding: 12px 18px; border-radius: 12px;
    width: max-content; max-width: calc(100vw - 32px); text-align: center; font-size: 14px;
  }

  /* ---------- Dialogs ---------- */
  #overlay {
    position: fixed; inset: 0; background: rgba(10, 6, 25, 0.8);
    display: none; align-items: center; justify-content: center; z-index: 20;
  }
  #overlay.show { display: flex; }
  .dialog {
    background: var(--panel-solid); padding: 26px 22px; border-radius: 18px; text-align: center;
    width: min(340px, calc(100vw - 32px)); max-height: calc(100% - 32px); overflow-y: auto;
    box-shadow: 0 0 50px rgba(140, 90, 255, 0.4); animation: fade-in 0.25s ease-out;
  }
  .dialog h2 { margin: 0 0 8px; }
  .dialog p { color: var(--muted); margin: 6px 0 16px; }
  button {
    display: block; width: 100%; margin-top: 10px; padding: 14px; border: 0; border-radius: 12px;
    font-size: 16px; font-weight: 700; cursor: pointer; font-family: inherit;
  }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .primary { background: var(--accent); color: #2a1d00; }
  .secondary { background: var(--button); color: var(--text); }
  .rescue { background: linear-gradient(135deg, #38e54d, #00c2ff); color: #062a12; animation: pulse 1.6s ease-in-out infinite; }
  button small { display: block; font-weight: 500; font-size: 12px; opacity: 0.85; margin-top: 2px; }
  .stars { font-size: 40px; letter-spacing: 6px; margin: 4px 0 6px; }
  .stars span { display: inline-block; color: #4b3f78; }
  .stars span.on { color: var(--accent); text-shadow: 0 0 16px rgba(255, 214, 10, 0.8); animation: star-in 0.5s ease-out backwards; }
  .stars span:nth-child(2).on { animation-delay: 0.25s; }
  .stars span:nth-child(3).on { animation-delay: 0.5s; }
  @keyframes star-in { from { transform: scale(0) rotate(-90deg); } 70% { transform: scale(1.4); } }
  #win-streak { color: #ffb347; font-weight: 700; }
  .coins-won { color: var(--accent); font-weight: 800; font-size: 18px; }
  .ad-box {
    margin: 4px 0 14px; padding: 36px 12px; border-radius: 12px; font-weight: 700;
    background: repeating-linear-gradient(45deg, #3a2a6e, #3a2a6e 12px, #33245f 12px, #33245f 24px);
    color: var(--muted);
  }
  #ad-count { font-size: 40px; color: var(--text); display: block; margin-top: 6px; }
  [hidden] { display: none !important; }
  @media (prefers-reduced-motion: reduce) {
    #combo, .piece, .logo-tile, .play-btn, .rescue, .level-node.current { animation: none; }
  }
</style>
</head>
<body>
<canvas id="bg"></canvas>

<!-- Title screen -->
<div class="screen" id="screen-title">
  <div class="logo" aria-label="Klotz Kaskade">
    <div class="logo-row" id="logo-row"></div>
    <div class="logo-sub">KASKADE</div>
  </div>
  <div class="title-actions">
    <button class="primary play-btn" id="btn-play">Spielen</button>
    <div class="pill" id="title-streak" hidden></div>
  </div>
</div>

<!-- Home / main menu -->
<div class="screen" id="screen-home" hidden>
  <div class="home-head"><div class="home-title">Klotz Kaskade</div><div class="coin-pill" id="home-coins"></div></div>
  <button class="mode-card card-daily" id="btn-daily">
    <span class="emoji">☀️</span>
    <span class="txt"><span class="name">Tages-Challenge</span><span class="info" id="daily-info"></span></span>
  </button>
  <button class="mode-card card-endless" id="btn-endless">
    <span class="emoji">♾️</span>
    <span class="txt"><span class="name">Endlos</span><span class="info" id="endless-info"></span></span>
  </button>
  <button class="mode-card card-levels" id="btn-levels">
    <span class="emoji">🗺️</span>
    <span class="txt"><span class="name">Level</span><span class="info" id="levels-info"></span></span>
  </button>
  <button class="mode-card card-shop" id="btn-shop">
    <span class="emoji">🛍️</span>
    <span class="txt"><span class="name">Shop</span><span class="info">Neue Blöcke und Hintergründe</span></span>
  </button>
  <div class="home-nav">
    <button class="secondary" id="btn-stats">📊 Statistik</button>
    <button class="secondary" id="btn-settings">⚙️ Einstellungen</button>
  </div>
</div>

<!-- Level map -->
<div class="screen" id="screen-levels" hidden>
  <div class="topbar">
    <button class="icon-btn" data-back="screen-home" aria-label="Zurück">←</button>
    <h2>Level</h2>
    <span class="stars-total" id="stars-total"></span>
  </div>
  <div class="map" id="level-map"></div>
</div>

<!-- Shop -->
<div class="screen" id="screen-shop" hidden>
  <div class="topbar">
    <button class="icon-btn" data-back="screen-home" aria-label="Zurück">←</button>
    <h2>Shop</h2>
    <span class="coin-pill" id="shop-coins"></span>
  </div>
