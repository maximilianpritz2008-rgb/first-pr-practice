<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Klotz Kaskade</title>
<style>
  :root {
    --bg: #1b1530;
    --panel: #2a2148;
    --cell: #3a2f63;
    --cell-line: #463a75;
    --text: #f4efff;
    --muted: #b3a8d6;
    --accent: #ffcc4d;
    --stone: #6d6491;
    --button: #5a4b94;
    --ghost-ok: rgba(255, 255, 255, 0.35);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%;
    background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    overscroll-behavior: none; touch-action: none; user-select: none;
  }
  #app {
    max-width: 480px; margin: 0 auto; padding: 16px;
    display: flex; flex-direction: column; align-items: center; gap: 14px;
    min-height: 100%;
  }
  header { width: 100%; display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; }
  .title-row { display: flex; align-items: center; gap: 8px; }
  h1 { margin: 0; font-size: 22px; letter-spacing: 0.5px; }
  .icon-btn {
    width: 36px; height: 36px; margin: 0; padding: 0; border-radius: 10px;
    background: var(--panel); color: var(--text); font-size: 17px;
  }
  #status { font-size: 13px; color: var(--muted); margin-top: 6px; }
  .scores { text-align: right; }
  .score { font-size: 32px; font-weight: 800; color: var(--accent); line-height: 1; }
  .best { font-size: 13px; color: var(--muted); margin-top: 4px; }
  #goal { width: 100%; height: 8px; background: var(--panel); border-radius: 4px; overflow: hidden; }
  #goal-fill { height: 100%; width: 0; background: var(--accent); transition: width 0.3s; }
  #combo {
    height: 22px; font-weight: 700; color: var(--accent);
    opacity: 0; transition: opacity 0.2s;
  }
  #board {
    --size: min(calc(100vw - 32px), 420px);
    width: var(--size); height: var(--size);
    display: grid; grid-template-columns: repeat(8, 1fr); gap: 3px;
    padding: 6px; background: var(--panel); border-radius: 14px;
  }
  .cell { background: var(--cell); border-radius: 5px; box-shadow: inset 0 0 0 1px var(--cell-line); }
  .block {
    border-radius: 5px;
    box-shadow: inset 0 -4px 0 rgba(0,0,0,0.25), inset 0 3px 0 rgba(255,255,255,0.3);
  }
  .cell.ghost { background: var(--ghost-ok); }
  .cell.will-clear { filter: brightness(1.5); }
  .cell.clearing { animation: pop 0.35s ease-out forwards; }
  @keyframes pop {
    0% { transform: scale(1); }
    50% { transform: scale(1.15); filter: brightness(2); }
    100% { transform: scale(0); opacity: 0; }
  }
  #tray {
    width: 100%; min-height: 130px;
    display: grid; grid-template-columns: repeat(3, 1fr); align-items: center; justify-items: center;
  }
  .slot { width: 100%; height: 120px; display: flex; align-items: center; justify-content: center; }
  .piece { display: grid; gap: 2px; cursor: grab; touch-action: none; }
  .piece.unfit { opacity: 0.35; }
  .piece.hidden { visibility: hidden; }
  #drag { position: fixed; left: 0; top: 0; pointer-events: none; z-index: 10; display: grid; gap: 3px; }
  #overlay {
    position: fixed; inset: 0; background: rgba(10, 6, 25, 0.85);
    display: none; align-items: center; justify-content: center; z-index: 20;
  }
  #overlay.show { display: flex; }
  .dialog {
    background: var(--panel); padding: 28px 24px; border-radius: 18px; text-align: center;
    width: min(340px, calc(100vw - 32px));
  }
  .dialog h2 { margin: 0 0 8px; }
  .dialog p { color: var(--muted); margin: 6px 0 18px; }
  button {
    display: block; width: 100%; margin-top: 10px; padding: 14px; border: 0; border-radius: 12px;
    font-size: 16px; font-weight: 700; cursor: pointer; font-family: inherit;
  }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .primary { background: var(--accent); color: #2a1d00; }
  .secondary { background: var(--button); color: var(--text); }
  .primary small { display: block; font-weight: 500; font-size: 12px; opacity: 0.75; }
  .level-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-top: 10px; }
  .level-grid button { margin: 0; padding: 12px 0; }
  .level-grid button:disabled { opacity: 0.35; cursor: default; }
  .level-grid button.done { background: var(--accent); color: #2a1d00; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div id="app">
  <header>
    <div>
      <div class="title-row">
        <button class="icon-btn" id="btn-menu" aria-label="Menü">☰</button>
        <button class="icon-btn" id="btn-sound" aria-label="Ton an/aus">🔊</button>
        <h1>Klotz Kaskade</h1>
      </div>
      <div id="status"></div>
    </div>
    <div class="scores">
      <div class="score" id="score">0</div>
      <div class="best" id="best-row">Rekord: <span id="best">0</span></div>
    </div>
  </header>
  <div id="goal" hidden><div id="goal-fill"></div></div>
  <div id="combo"></div>
  <div id="board"></div>
  <div id="tray"></div>
</div>
<div id="drag"></div>
<div id="overlay">
  <div class="dialog" id="dlg-menu">
    <h2>Klotz Kaskade</h2>
    <p>Zieh die Formen aufs Feld. Volle Reihen und Spalten verschwinden.</p>
    <button class="primary" id="btn-endless">Endlos spielen</button>
    <p style="margin: 18px 0 0">Level</p>
    <div class="level-grid" id="level-grid"></div>
  </div>
  <div class="dialog" id="dlg-over" hidden>
    <h2>Kein Platz mehr!</h2>
    <p id="over-text"></p>
    <button class="primary" id="btn-revive">Zweite Chance<small>(hier käme eine Belohnungs-Werbung)</small></button>
    <button class="secondary" id="btn-retry">Nochmal</button>
    <button class="secondary" id="btn-over-menu">Menü</button>
  </div>
  <div class="dialog" id="dlg-win" hidden>
    <h2 id="win-title">Level geschafft!</h2>
    <p id="win-text"></p>
    <button class="primary" id="btn-next">Nächstes Level</button>
    <button class="secondary" id="btn-win-menu">Menü</button>
  </div>
</div>

<script>
(() => {
  const SIZE = 8;
  const COLORS = ['#ff6b8b', '#ffb347', '#ffe066', '#6bdc8b', '#4dc3ff', '#9b7bff', '#ff8adf'];
  const STONE = getComputedStyle(document.documentElement).getPropertyValue('--stone').trim();

  // Shapes as lists of [row, col]; weight controls how often a shape appears.
  const SHAPES = [
    { cells: [[0,0]], weight: 2 },
    { cells: [[0,0],[0,1]], weight: 3 },
    { cells: [[0,0],[1,0]], weight: 3 },
    { cells: [[0,0],[0,1],[0,2]], weight: 3 },
    { cells: [[0,0],[1,0],[2,0]], weight: 3 },
    { cells: [[0,0],[0,1],[0,2],[0,3]], weight: 2 },
    { cells: [[0,0],[1,0],[2,0],[3,0]], weight: 2 },
    { cells: [[0,0],[0,1],[0,2],[0,3],[0,4]], weight: 1 },
    { cells: [[0,0],[1,0],[2,0],[3,0],[4,0]], weight: 1 },
    { cells: [[0,0],[0,1],[1,0],[1,1]], weight: 3 },
    { cells: [[0,0],[0,1],[0,2],[1,0],[1,1],[1,2],[2,0],[2,1],[2,2]], weight: 1 },
    { cells: [[0,0],[1,0],[1,1]], weight: 2 },
    { cells: [[0,1],[1,0],[1,1]], weight: 2 },
    { cells: [[0,0],[0,1],[1,0]], weight: 2 },
    { cells: [[0,0],[0,1],[1,1]], weight: 2 },
    { cells: [[0,0],[1,0],[2,0],[2,1]], weight: 2 },
    { cells: [[0,1],[1,1],[2,1],[2,0]], weight: 2 },
    { cells: [[0,0],[0,1],[0,2],[1,1]], weight: 2 },
    { cells: [[1,0],[1,1],[1,2],[0,1]], weight: 2 },
    { cells: [[0,0],[0,1],[1,1],[1,2]], weight: 1 },
    { cells: [[0,1],[0,2],[1,0],[1,1]], weight: 1 },
    { cells: [[0,0],[1,1]], weight: 1 },
    { cells: [[0,0],[1,0],[2,0],[2,1],[2,2]], weight: 1 },
  ];
  const TOTAL_WEIGHT = SHAPES.reduce((s, x) => s + x.weight, 0);

  // Each level: number of lines to clear, and a starting layout ('#' = stone block).
  const LEVELS = [
    { lines: 3, map: [] },
    { lines: 4, map: ['........','........','........','........','........','........','##....##','###..###'] },
    { lines: 5, map: ['........','........','...##...','..####..','..####..','...##...','........','........'] },
    { lines: 6, map: ['#.......','.#......','..#.....','...#....','....#...','.....#..','......#.','.......#'] },
    { lines: 7, map: ['.#....#.','.#....#.','.#....#.','........','........','.#....#.','.#....#.','.#....#.'] },
    { lines: 8, map: ['###..###','#......#','#......#','........','........','#......#','#......#','###..###'] },
    { lines: 9, map: ['#..#..#.','........','.#..#..#','........','#..#..#.','........','.#..#..#','........'] },
    { lines: 10, map: ['........','........','........','........','#.#.#.#.','.#.#.#.#','#.#.#.#.','.#.#.#.#'] },
    { lines: 12, map: ['........','.######.','.#....#.','.#....#.','.#....#.','.#....#.','.######.','........'] },
    { lines: 15, map: ['#......#','.#....#.','..#..#..','...##...','...##...','..#..#..','.#....#.','#......#'] },
  ];

  const $ = id => document.getElementById(id);
  const boardEl = $('board'), trayEl = $('tray'), dragEl = $('drag');
  const scoreEl = $('score'), bestEl = $('best'), comboEl = $('combo'), statusEl = $('status');
  const overlay = $('overlay');

  // mode: 'endless' or 'level'; level: index into LEVELS
  let grid, pieces, score, combo, best, revived, busy, mode, level, lines, over;
  const cellEls = [];

  function load(key, fallback) {
    try { const v = localStorage.getItem(key); return v === null ? fallback : JSON.parse(v); } catch { return fallback; }
  }
  function save(key, value) {
    try { localStorage.setItem(key, JSON.stringify(value)); } catch {}
  }

  // ---------- Sound (synthesised with Web Audio, no files needed) ----------
  let audio = null;
  let muted = load('klotz-muted', false);

  function ensureAudio() {
    if (muted) return null;
    if (!audio) {
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return null;
      audio = new Ctx();
    }
    if (audio.state === 'suspended') audio.resume();
    return audio;
  }

  function tone(freq, start, duration, { type = 'sine', volume = 0.15, slideTo = null } = {}) {
    const ctx = ensureAudio();
    if (!ctx) return;
    const t = ctx.currentTime + start;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t);
    if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, t + duration);
    gain.gain.setValueAtTime(0.0001, t);
    gain.gain.exponentialRampToValueAtTime(volume, t + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + duration);
    osc.connect(gain).connect(ctx.destination);
    osc.start(t);
    osc.stop(t + duration + 0.02);
  }

  // Small random pitch variation keeps repeated sounds from getting tiring.
  const vary = f => f * (0.95 + Math.random() * 0.1);
  const PENTATONIC = [523.25, 587.33, 659.25, 783.99, 880, 1046.5, 1174.66, 1318.51, 1567.98];

  const sfx = {
    pick: () => tone(vary(660), 0, 0.05, { type: 'triangle', volume: 0.08 }),
    place: () => tone(vary(180), 0, 0.12, { type: 'triangle', volume: 0.25, slideTo: 90 }),
    invalid: () => tone(140, 0, 0.15, { type: 'square', volume: 0.05, slideTo: 100 }),
    clear(lineCount, streak) {
      // Longer streaks start the arpeggio higher, more lines add more notes.
      const startNote = Math.min(streak - 1, 3);
      const notes = 2 + lineCount;
      for (let i = 0; i < notes; i++) {
        const f = PENTATONIC[Math.min(startNote + i, PENTATONIC.length - 1)];
        tone(f, i * 0.07, 0.25, { type: 'triangle', volume: 0.12 });
      }
    },
    gameOver() {
      [392, 330, 262, 196].forEach((f, i) => tone(f, i * 0.16, 0.3, { type: 'sawtooth', volume: 0.06 }));
    },
    win() {
      [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => tone(f, i * 0.12, 0.3, { type: 'triangle', volume: 0.14 }));
      tone(1046.5, 0.5, 0.6, { type: 'sine', volume: 0.12 });
    },
    click: () => tone(880, 0, 0.04, { type: 'triangle', volume: 0.06 }),
  };

  function renderSoundButton() {
    $('btn-sound').textContent = muted ? '🔇' : '🔊';
  }

  // ---------- Board setup ----------
  for (let i = 0; i < SIZE * SIZE; i++) {
    const c = document.createElement('div');
    c.className = 'cell';
    boardEl.appendChild(c);
    cellEls.push(c);
  }

  function randomShape() {
    let r = Math.random() * TOTAL_WEIGHT;
    for (const s of SHAPES) { if ((r -= s.weight) < 0) return s.cells; }
    return SHAPES[0].cells;
  }

  function canPlace(cells, row, col) {
    return cells.every(([r, c]) => {
      const rr = row + r, cc = col + c;
      return rr >= 0 && rr < SIZE && cc >= 0 && cc < SIZE && !grid[rr][cc];
    });
  }

  function fitsAnywhere(cells) {
    for (let r = 0; r < SIZE; r++)
      for (let c = 0; c < SIZE; c++)
        if (canPlace(cells, r, c)) return true;
    return false;
  }

  // Deal three pieces, guaranteeing at least one of them fits so a fresh hand is never instantly lost.
  function dealPieces() {
    pieces = [0, 1, 2].map(() => ({
      cells: randomShape(),
      color: COLORS[Math.floor(Math.random() * COLORS.length)],
    }));
    if (!pieces.some(p => fitsAnywhere(p.cells))) {
      for (let tries = 0; tries < 50; tries++) {
        const cells = randomShape();
        if (fitsAnywhere(cells)) { pieces[0].cells = cells; break; }
      }
    }
  }

  function renderBoard() {
    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        const el = cellEls[r * SIZE + c];
        el.className = 'cell';
        el.style.background = '';
        if (grid[r][c]) { el.classList.add('block'); el.style.background = grid[r][c]; }
      }
    }
  }

  function buildPieceEl(piece, cellSize, gap) {
    const rows = Math.max(...piece.cells.map(([r]) => r)) + 1;
    const cols = Math.max(...piece.cells.map(([, c]) => c)) + 1;
    const el = document.createElement('div');
    el.className = 'piece';
    el.style.gridTemplateColumns = `repeat(${cols}, ${cellSize}px)`;
    el.style.gridTemplateRows = `repeat(${rows}, ${cellSize}px)`;
    el.style.gap = gap + 'px';
    for (const [r, c] of piece.cells) {
      const b = document.createElement('div');
      b.className = 'block';
      b.style.background = piece.color;
      b.style.gridRow = r + 1;
      b.style.gridColumn = c + 1;
      el.appendChild(b);
    }
    return el;
  }

  function renderTray() {
    trayEl.innerHTML = '';
    pieces.forEach((p, i) => {
      const slot = document.createElement('div');
      slot.className = 'slot';
      if (p) {
        const el = buildPieceEl(p, 20, 2);
        if (!fitsAnywhere(p.cells)) el.classList.add('unfit');
        el.addEventListener('pointerdown', e => startDrag(e, i, el));
        slot.appendChild(el);
      }
      trayEl.appendChild(slot);
    });
  }

  function renderHud() {
    scoreEl.textContent = score;
    if (mode === 'endless') {
      if (score > best) { best = score; save('klotz-best', best); }
      bestEl.textContent = best;
      statusEl.textContent = 'Endlos-Modus';
    } else {
      const goal = LEVELS[level].lines;
      statusEl.textContent = `Level ${level + 1} · Linien ${Math.min(lines, goal)}/${goal}`;
      $('goal-fill').style.width = Math.min(100, (lines / goal) * 100) + '%';
    }
  }

  // ---------- Drag & drop ----------
  let drag = null;

  function boardMetrics() {
    const rect = boardEl.getBoundingClientRect();
    const pad = 6, gap = 3;
    const cell = (rect.width - pad * 2 - gap * (SIZE - 1)) / SIZE;
    return { rect, pad, gap, cell };
  }

  function startDrag(e, index, sourceEl) {
    if (busy || over) return;
    e.preventDefault();
    sfx.pick();
    const m = boardMetrics();
    const piece = pieces[index];
    const el = buildPieceEl(piece, m.cell, m.gap);
    dragEl.innerHTML = '';
    dragEl.appendChild(el);
    const w = el.offsetWidth, h = el.offsetHeight;
    // Lift the piece above the finger so it stays visible on touch screens.
    const lift = e.pointerType === 'touch' ? h + 40 : h / 2;
    drag = { index, piece, sourceEl, w, h, lift, target: null };
    sourceEl.classList.add('hidden');
    moveDrag(e);
    window.addEventListener('pointermove', moveDrag);
    window.addEventListener('pointerup', endDrag);
    window.addEventListener('pointercancel', endDrag);
  }

  function moveDrag(e) {
    if (!drag) return;
    const x = e.clientX - drag.w / 2;
    const y = e.clientY - drag.lift;
    dragEl.style.transform = `translate(${x}px, ${y}px)`;

    const m = boardMetrics();
    const step = m.cell + m.gap;
    const col = Math.round((x - m.rect.left - m.pad) / step);
    const row = Math.round((y - m.rect.top - m.pad) / step);
    drag.target = canPlace(drag.piece.cells, row, col) ? { row, col } : null;
    showGhost();
  }

  function showGhost() {
    renderBoard();
    if (!drag || !drag.target) return;
    const { row, col } = drag.target;
    for (const [r, c] of drag.piece.cells) cellEls[(row + r) * SIZE + col + c].classList.add('ghost');
    // Highlight rows/columns that this placement would complete.
    const filled = new Set(drag.piece.cells.map(([r, c]) => (row + r) * SIZE + col + c));
    const isFull = (r, c) => grid[r][c] || filled.has(r * SIZE + c);
    for (let r = 0; r < SIZE; r++) {
      if ([...Array(SIZE).keys()].every(c => isFull(r, c)))
        for (let c = 0; c < SIZE; c++) cellEls[r * SIZE + c].classList.add('will-clear');
    }
    for (let c = 0; c < SIZE; c++) {
      if ([...Array(SIZE).keys()].every(r => isFull(r, c)))
        for (let r = 0; r < SIZE; r++) cellEls[r * SIZE + c].classList.add('will-clear');
    }
  }

  function endDrag(e) {
    window.removeEventListener('pointermove', moveDrag);
    window.removeEventListener('pointerup', endDrag);
    window.removeEventListener('pointercancel', endDrag);
    dragEl.innerHTML = '';
    if (!drag) return;
    const { index, piece, sourceEl, target } = drag;
    drag = null;
    if (target) {
      place(index, piece, target.row, target.col);
    } else {
      // Only buzz when the piece was dropped over the board, not when the player just let go in the tray.
      const rect = boardEl.getBoundingClientRect();
      if (e.type === 'pointerup' && e.clientY < rect.bottom) sfx.invalid();
      sourceEl.classList.remove('hidden');
      renderBoard();
    }
  }

  // ---------- Game logic ----------
  function place(index, piece, row, col) {
    for (const [r, c] of piece.cells) grid[row + r][col + c] = piece.color;
    pieces[index] = null;
    score += piece.cells.length;

    const fullRows = [], fullCols = [];
    for (let r = 0; r < SIZE; r++) if (grid[r].every(Boolean)) fullRows.push(r);
    for (let c = 0; c < SIZE; c++) if (grid.every(rowArr => rowArr[c])) fullCols.push(c);
    const cleared = fullRows.length + fullCols.length;

    renderBoard();

    if (cleared > 0) {
      combo++;
      lines += cleared;
      // More lines at once and longer streaks are worth disproportionately more.
      const gained = cleared * 10 * cleared * combo;
      score += gained;
      flashCombo(cleared, combo, gained);
      sfx.clear(cleared, combo);

      const toClear = new Set();
      fullRows.forEach(r => { for (let c = 0; c < SIZE; c++) toClear.add(r * SIZE + c); });
      fullCols.forEach(c => { for (let r = 0; r < SIZE; r++) toClear.add(r * SIZE + c); });
      toClear.forEach(i => cellEls[i].classList.add('clearing'));
      busy = true;
      setTimeout(() => {
        toClear.forEach(i => { grid[Math.floor(i / SIZE)][i % SIZE] = null; });
        busy = false;
        afterMove();
      }, 350);
    } else {
      combo = 0;
      sfx.place();
      afterMove();
    }
    renderHud();
  }

  function afterMove() {
    if (pieces.every(p => !p)) dealPieces();
    renderBoard();
    renderTray();
    if (mode === 'level' && lines >= LEVELS[level].lines) return winLevel();
    if (!pieces.some(p => p && fitsAnywhere(p.cells))) gameOver();
  }

  let comboTimer;
  function flashCombo(cleared, streak, gained) {
    const parts = [];
    if (cleared > 1) parts.push(`${cleared} Linien!`);
    if (streak > 1) parts.push(`Combo x${streak}`);
    parts.push(`+${gained}`);
    comboEl.textContent = parts.join('  ·  ');
    comboEl.style.opacity = 1;
    clearTimeout(comboTimer);
    comboTimer = setTimeout(() => { comboEl.style.opacity = 0; }, 1200);
  }

  function showDialog(id) {
    for (const d of ['dlg-menu', 'dlg-over', 'dlg-win']) $(d).hidden = d !== id;
    overlay.classList.add('show');
  }

  function gameOver() {
    over = true;
    sfx.gameOver();
    $('over-text').textContent = mode === 'endless'
      ? `Punkte: ${score}`
      : `Level ${level + 1}: ${lines} von ${LEVELS[level].lines} Linien`;
    $('btn-revive').hidden = revived;
    setTimeout(() => showDialog('dlg-over'), 400);
  }

  function winLevel() {
    over = true;
    const unlocked = load('klotz-unlocked', 1);
    if (level + 2 > unlocked) save('klotz-unlocked', Math.min(level + 2, LEVELS.length));
    const last = level === LEVELS.length - 1;
    $('win-title').textContent = last ? 'Alle Level geschafft!' : 'Level geschafft!';
    $('win-text').textContent = `Level ${level + 1} mit ${score} Punkten`;
    $('btn-next').hidden = last;
    setTimeout(() => { sfx.win(); showDialog('dlg-win'); }, 400);
  }

  // Second chance: wipe the middle four rows and deal a fresh hand.
  // In a published game this is where a rewarded video ad would be shown.
  function revive() {
    revived = true;
    over = false;
    overlay.classList.remove('show');
    for (let r = 2; r < 6; r++) grid[r].fill(null);
    dealPieces();
    renderBoard();
    renderTray();
  }

  function startGame(newMode, levelIndex = 0) {
    mode = newMode;
    level = levelIndex;
    grid = Array.from({ length: SIZE }, () => Array(SIZE).fill(null));
    if (mode === 'level') {
      LEVELS[level].map.forEach((line, r) => {
        [...line].forEach((ch, c) => { if (ch === '#') grid[r][c] = STONE; });
      });
    }
    score = 0; combo = 0; lines = 0; revived = false; busy = false; over = false;
    best = load('klotz-best', 0);
    $('goal').hidden = mode !== 'level';
    $('best-row').hidden = mode !== 'endless';
    overlay.classList.remove('show');
    dealPieces();
    renderBoard();
    renderTray();
    renderHud();
  }

  function openMenu() {
    const unlocked = load('klotz-unlocked', 1);
    const gridEl = $('level-grid');
    gridEl.innerHTML = '';
    LEVELS.forEach((_, i) => {
      const b = document.createElement('button');
      b.className = 'secondary' + (i + 1 < unlocked ? ' done' : '');
      b.textContent = i + 1;
      b.disabled = i + 1 > unlocked;
      b.setAttribute('aria-label', `Level ${i + 1}`);
      b.addEventListener('click', () => { sfx.click(); startGame('level', i); });
      gridEl.appendChild(b);
    });
    showDialog('dlg-menu');
  }

  $('btn-endless').addEventListener('click', () => { sfx.click(); startGame('endless'); });
  $('btn-revive').addEventListener('click', () => { sfx.click(); revive(); });
  $('btn-retry').addEventListener('click', () => { sfx.click(); startGame(mode, level); });
  $('btn-next').addEventListener('click', () => { sfx.click(); startGame('level', level + 1); });
  $('btn-over-menu').addEventListener('click', () => { sfx.click(); openMenu(); });
  $('btn-win-menu').addEventListener('click', () => { sfx.click(); openMenu(); });
  $('btn-menu').addEventListener('click', () => { sfx.click(); openMenu(); });
  $('btn-sound').addEventListener('click', () => {
    muted = !muted;
    save('klotz-muted', muted);
    renderSoundButton();
    sfx.click();
  });

  renderSoundButton();
  startGame('endless');
  openMenu();
})();
</script>
</body>
</html>
