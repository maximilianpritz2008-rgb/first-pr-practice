<script>
(() => {
  const SIZE = 8;
  const CLASSIC_COLORS = ['#ff4d6d', '#ff9f1c', '#ffd60a', '#38e54d', '#00c2ff', '#8f5bff', '#ff4fd8'];
  let COLORS = CLASSIC_COLORS;   // the current skin's palette
  // Obstacles on the board: a bush disappears when its row or column is cleared,
  // a thorny bush first turns into a normal bush.
  const BUSH = 'bush', THORNY = 'thorny';
  const isBush = v => v === BUSH || v === THORNY;
  const BUSH_COLORS = { [BUSH]: ['#51cf66', '#8ce99a', '#2f9e44'], [THORNY]: ['#2f9e44', '#ff4d6d', '#1e6b34'] };
  const DAILY_LINES = 10;
  const MAX_RESCUES = 2;
  const BREAK_AFTER_MS = 20 * 60 * 1000;

  // Shapes as lists of [row, col]; weight controls how often a shape appears.
  const SHAPES = [
    { cells: [[0,0]], weight: 2 },
    { cells: [[0,0],[0,1]], weight: 3 },
    { cells: [[0,0],[1,0]], weight: 3 },
    { cells: [[0,0],[0,1],[0,2]], weight: 3 },
    { cells: [[0,0],[1,0],[2,0]], weight: 3 },
    { cells: [[0,0],[0,1],[0,2],[0,3]], weight: 2 },
    { cells: [[0,0],[1,0],[2,0],[3,0]], weight: 2 },
    { cells: [[0,0],[0,1],[0,2],[0,3],[0,4]], weight: 1 },
    { cells: [[0,0],[1,0],[2,0],[3,0],[4,0]], weight: 1 },
    { cells: [[0,0],[0,1],[1,0],[1,1]], weight: 3 },
    { cells: [[0,0],[0,1],[0,2],[1,0],[1,1],[1,2],[2,0],[2,1],[2,2]], weight: 1 },
    { cells: [[0,0],[1,0],[1,1]], weight: 2 },
    { cells: [[0,1],[1,0],[1,1]], weight: 2 },
    { cells: [[0,0],[0,1],[1,0]], weight: 2 },
    { cells: [[0,0],[0,1],[1,1]], weight: 2 },
    { cells: [[0,0],[1,0],[2,0],[2,1]], weight: 2 },
    { cells: [[0,1],[1,1],[2,1],[2,0]], weight: 2 },
    { cells: [[0,0],[0,1],[0,2],[1,1]], weight: 2 },
    { cells: [[1,0],[1,1],[1,2],[0,1]], weight: 2 },
    { cells: [[0,0],[0,1],[1,1],[1,2]], weight: 1 },
    { cells: [[0,1],[0,2],[1,0],[1,1]], weight: 1 },
    { cells: [[0,0],[1,1]], weight: 1 },
    { cells: [[0,0],[1,0],[2,0],[2,1],[2,2]], weight: 1 },
  ];
  const TOTAL_WEIGHT = SHAPES.reduce((s, x) => s + x.weight, 0);

  // Each level has a starting layout ('#' = bush, '@' = thorny bush). With bushes the goal is to
  // clear all of them; a level without bushes asks for a number of lines instead.
  const LEVELS = [
    { lines: 3, map: [] },
    { map: ['........','........','........','........','........','........','##....##','###..###'] },
    { map: ['........','........','...##...','..####..','..####..','...##...','........','........'] },
    { map: ['#.......','.#......','..#.....','...#....','....#...','.....#..','......#.','.......#'] },
    { map: ['.#....#.','.#....#.','.#....#.','........','........','.#....#.','.#....#.','.#....#.'] },
    { map: ['###..###','#......#','#......#','........','........','#......#','#......#','###..###'] },
    { map: ['@..#..@.','........','.#..#..#','........','#..#..#.','........','.@..#..@','........'] },
    { map: ['........','........','........','........','#.#.@.#.','.#.#.#.#','#.@.#.#.','.#.#.#.#'] },
    { map: ['........','.@####@.','.#....#.','.#....#.','.#....#.','.#....#.','.@####@.','........'] },
    { map: ['@......@','.#....#.','..#..#..','...@@...','...@@...','..#..#..','.#....#.','@......@'] },
  ];
  const bushCount = map => map.join('').replace(/[^#@]/g, '').length;

  const $ = id => document.getElementById(id);
  const boardEl = $('board'), trayEl = $('tray'), dragEl = $('drag');
  const scoreEl = $('score'), bestEl = $('best'), comboEl = $('combo'), statusEl = $('status');
  const overlay = $('overlay');

  // mode: 'endless', 'level' or 'daily'; level: index into LEVELS
  let grid, pieces, score, combo, best, rescues, busy, mode, level, lines, over;
  let rand = Math.random;
  let luckyHands = 0, handsDealt = 0, luckReadyAt = 0;
  let justPlaced = new Set();
  const cellEls = [];

  function load(key, fallback) {
    try { const v = localStorage.getItem(key); return v === null ? fallback : JSON.parse(v); } catch { return fallback; }
  }
  function save(key, value) {
    try { localStorage.setItem(key, JSON.stringify(value)); } catch {}
  }
  const STORAGE_KEYS = ['klotz-best', 'klotz-unlocked', 'klotz-stars', 'klotz-daily', 'klotz-stats', 'klotz-ads-watched',
    'klotz-coins', 'klotz-owned', 'klotz-skin', 'klotz-bg', 'klotz-free-coins'];

  // ---------- Coins & shop items ----------
  const SKINS = [
    { id: 'classic', name: 'Klassik', price: 0, colors: CLASSIC_COLORS },
    { id: 'candy', name: 'Süßigkeiten', price: 150, colors: ['#ff8fab', '#ffb3c6', '#a0c4ff', '#9bf6ff', '#caffbf', '#fdffb6', '#ffc6ff'] },
    { id: 'neon', name: 'Neon', price: 250, colors: ['#ff2bd6', '#00f0ff', '#39ff14', '#fffb00', '#ff6b00', '#bf5bff', '#ff3864'] },
    { id: 'gems', name: 'Edelsteine', price: 400, colors: ['#e0115f', '#0f52ba', '#50c878', '#9966cc', '#ffbf00', '#00a6a6', '#ff5f1f'] },
  ];
  const BACKGROUNDS = [
    { id: 'evening', name: 'Abendhügel', price: 0 },
    { id: 'beach', name: 'Strand', price: 200 },
    { id: 'winter', name: 'Winternacht', price: 350 },
  ];
  // Coins per cleared line, per win and per star; endless pays per points scored.
  const COINS = { line: 1, levelWin: 10, dailyWin: 25, perStar: 5, endlessPoints: 200, freeAd: 50, freeAdsPerDay: 3 };

  const coins = () => load('klotz-coins', 0);
  function addCoins(n) { save('klotz-coins', coins() + n); }
  const owned = () => ({ skins: ['classic'], bgs: ['evening'], ...load('klotz-owned', {}) });
  let skinId = load('klotz-skin', 'classic');
  let bgTheme = load('klotz-bg', 'evening');

  function applySkin() {
    const skin = SKINS.find(x => x.id === skinId) || SKINS[0];
    COLORS = skin.colors;
    for (const id of ['board', 'tray', 'drag']) $(id).dataset.skin = skin.id;
  }


  let calm = load('klotz-calm', false);
  const reducedMotion = () => calm || matchMedia('(prefers-reduced-motion: reduce)').matches;

  // ---------- Dates & seeded randomness for the daily challenge ----------
  function dateKey(d) {
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  }
  const todayKey = () => dateKey(new Date());
  const yesterdayKey = () => { const d = new Date(); d.setDate(d.getDate() - 1); return dateKey(d); };

  function hashString(s) {
    let h = 2166136261;
    for (const ch of s) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); }
    return h >>> 0;
  }
  // mulberry32: small seeded PRNG so every player gets the same daily board and pieces.
  function seededRandom(seed) {
    return () => {
      seed = (seed + 0x6D2B79F5) | 0;
      let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function dailyState() {
    const d = load('klotz-daily', { last: null, streak: 0, stars: {} });
    // A streak only counts while the last completed day is today or yesterday.
    const alive = d.last === todayKey() || d.last === yesterdayKey();
    return { ...d, streak: alive ? d.streak : 0 };
  }

  const loadStats = () => ({ games: 0, lines: 0, bestStreak: 0, ...load('klotz-stats', {}) });
  function addStats(change) {
    const s = loadStats();
    for (const [k, v] of Object.entries(change)) s[k] = (s[k] || 0) + v;
    save('klotz-stats', s);
  }

  // ---------- Sound (synthesised with Web Audio, no files needed) ----------
  let audio = null;
  let muted = load('klotz-muted', false);
  let musicOn = load('klotz-music', true);

  function getAudio() {
    if (!audio) {
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return null;
      audio = new Ctx();
    }
    if (audio.state === 'suspended' && !document.hidden) audio.resume();
    return audio;
  }

  function tone(freq, start, duration, { type = 'sine', volume = 0.15, slideTo = null, at = null } = {}) {
    const ctx = getAudio();
    if (!ctx) return;
    const t = at ?? ctx.currentTime + start;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t);
    if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, t + duration);
    gain.gain.setValueAtTime(0.0001, t);
    gain.gain.exponentialRampToValueAtTime(volume, t + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + duration);
    osc.connect(gain).connect(ctx.destination);
    osc.start(t);
    osc.stop(t + duration + 0.02);
  }

  // Small random pitch variation keeps repeated sounds from getting tiring.
  const vary = f => f * (0.95 + Math.random() * 0.1);
  const PENTATONIC = [523.25, 587.33, 659.25, 783.99, 880, 1046.5, 1174.66, 1318.51, 1567.98];
  const sfxTone = (...args) => { if (!muted) tone(...args); };

  const sfx = {
    pick: () => sfxTone(vary(660), 0, 0.05, { type: 'triangle', volume: 0.08 }),
    place: () => sfxTone(vary(180), 0, 0.12, { type: 'triangle', volume: 0.25, slideTo: 90 }),
    invalid: () => sfxTone(140, 0, 0.15, { type: 'square', volume: 0.05, slideTo: 100 }),
    clear(lineCount, streak) {
      // Longer streaks start the arpeggio higher, more lines add more notes.
      const startNote = Math.min(streak - 1, 3);
      const notes = 2 + lineCount;
      for (let i = 0; i < notes; i++) {
        const f = PENTATONIC[Math.min(startNote + i, PENTATONIC.length - 1)];
        sfxTone(f, i * 0.07, 0.25, { type: 'triangle', volume: 0.12 });
      }
    },
    gameOver() {
      [392, 330, 262, 196].forEach((f, i) => sfxTone(f, i * 0.16, 0.3, { type: 'sawtooth', volume: 0.06 }));
    },
    win() {
      [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => sfxTone(f, i * 0.12, 0.3, { type: 'triangle', volume: 0.14 }));
      sfxTone(1046.5, 0.5, 0.6, { type: 'sine', volume: 0.12 });
    },
    star: i => sfxTone(1046.5 * Math.pow(1.26, i), 0, 0.3, { type: 'triangle', volume: 0.12 }),
    // A soft rustle: a few quick, high, quiet notes.
    bush: () => [0, 0.04, 0.08].forEach(t => sfxTone(vary(1800), t, 0.06, { type: 'triangle', volume: 0.04, slideTo: 1200 })),
    click: () => sfxTone(880, 0, 0.04, { type: 'triangle', volume: 0.06 }),
  };

  // Background music: a gentle looping pentatonic tune, scheduled slightly ahead of time.
  const MUSIC_STEP = 60 / 104 / 2;
  const MELODY = [0, 2, 4, 2, 5, 4, 2, -1, 1, 3, 4, 3, 2, 0, 1, -1, 0, 2, 4, 5, 7, 5, 4, -1, 3, 2, 1, 2, 0, -1, -1, -1];
  const BASS = [130.81, 130.81, 174.61, 174.61, 196, 196, 130.81, 130.81];
  let musicStep = 0, musicTime = 0, musicTimer = null;

  function scheduleMusic() {
    const ctx = getAudio();
    if (!ctx || ctx.state !== 'running') return;
    if (musicTime < ctx.currentTime) musicTime = ctx.currentTime + 0.05;
    while (musicTime < ctx.currentTime + 0.25) {
      const note = MELODY[musicStep % MELODY.length];
      if (note >= 0) tone(PENTATONIC[note] / 2, 0, MUSIC_STEP * 1.6, { type: 'triangle', volume: 0.035, at: musicTime });
      if (musicStep % 4 === 0) tone(BASS[(musicStep / 4) % BASS.length], 0, MUSIC_STEP * 3.5, { type: 'sine', volume: 0.06, at: musicTime });
      musicStep++;
      musicTime += MUSIC_STEP;
    }
  }
  function updateMusic() {
    if (musicOn && !musicTimer) musicTimer = setInterval(scheduleMusic, 60);
    if (!musicOn && musicTimer) { clearInterval(musicTimer); musicTimer = null; }
  }

  function setMuted(value) { muted = value; save('klotz-muted', muted); renderSettings(); }
  function setMusic(value) { musicOn = value; save('klotz-music', musicOn); updateMusic(); renderSettings(); }

  // Browsers only allow audio after the first tap, so start it then.
  window.addEventListener('pointerdown', () => { getAudio(); updateMusic(); }, { once: true });
  document.addEventListener('visibilitychange', () => {
    if (!audio) return;
    if (document.hidden) audio.suspend(); else audio.resume();
  });

  // ---------- Screens ----------
  const SCREENS = ['screen-title', 'screen-home', 'screen-levels', 'screen-shop', 'screen-stats', 'screen-settings', 'screen-game'];
  let currentScreen = 'screen-title';

  function showScreen(id) {
    overlay.classList.remove('show');
    for (const s of SCREENS) $(s).hidden = s !== id;
    const el = $(id);
    el.classList.remove('enter');
    void el.offsetWidth;
    el.classList.add('enter');
    currentScreen = id;
    if (id === 'screen-home') renderHome();
    if (id === 'screen-levels') renderLevelMap();
    if (id === 'screen-stats') renderStats();
    if (id === 'screen-shop') renderShop();
    if (id === 'screen-settings') { $('reset-confirm').hidden = true; renderSettings(); }
    updateBackground();
  }

  function buildLogo() {
    const row = $('logo-row');
    [...'KLOTZ'].forEach((ch, i) => {
      const t = document.createElement('div');
      t.className = 'logo-tile';
      t.textContent = ch;
      t.style.backgroundColor = CLASSIC_COLORS[i];
      t.style.animationDelay = `${i * 0.12}s, ${0.8 + i * 0.2}s`;
      row.appendChild(t);
    });
  }

  function renderTitle() {
    const d = dailyState();
    $('title-streak').hidden = d.streak === 0;
    $('title-streak').textContent = `🔥 ${d.streak} ${d.streak === 1 ? 'Tag' : 'Tage'} Serie`;
  }

  const totalStars = () => Object.values(load('klotz-stars', {})).reduce((a, b) => a + b, 0);

  function renderHome() {
    const d = dailyState();
    const doneToday = d.last === todayKey();
    const todayStars = d.stars?.[todayKey()] || 0;
    const streakText = `🔥 ${d.streak} ${d.streak === 1 ? 'Tag' : 'Tage'}`;
    $('daily-info').textContent = doneToday
      ? `Heute geschafft ${'★'.repeat(todayStars)}${'☆'.repeat(3 - todayStars)} · ${streakText}`
      : d.streak > 0 ? `Neues Feld wartet · ${streakText} Serie` : 'Jeden Tag ein neues Feld';
    $('endless-info').textContent = `Rekord: ${load('klotz-best', 0)} Punkte`;
    $('home-coins').textContent = `🪙 ${coins()}`;
    const unlocked = load('klotz-unlocked', 1);
    $('levels-info').textContent = `${Math.min(unlocked, LEVELS.length)} von ${LEVELS.length} offen · ★ ${totalStars()} von ${LEVELS.length * 3}`;
  }

  function renderLevelMap() {
    const unlocked = load('klotz-unlocked', 1);
    const allStars = load('klotz-stars', {});
    $('stars-total').textContent = `★ ${totalStars()}/${LEVELS.length * 3}`;
    const map = $('level-map');
    map.innerHTML = '';
    LEVELS.forEach((lv, i) => {
      const row = document.createElement('div');
      row.className = 'map-row';
      const b = document.createElement('button');
      const s = allStars[i] || 0;
      b.className = 'level-node' + (s ? ' done' : '') + (!s && i + 1 === unlocked ? ' current' : '');
      b.disabled = i + 1 > unlocked;
      b.innerHTML = b.disabled ? '🔒' : `${i + 1}<small>${s ? '★'.repeat(s) + '☆'.repeat(3 - s) : (lv.lines ? lv.lines + ' Linien' : '🌿 ' + bushCount(lv.map))}</small>`;
      b.setAttribute('aria-label', `Level ${i + 1}${b.disabled ? ', gesperrt' : s ? `, ${s} Sterne` : ''}`);
      b.addEventListener('click', () => { sfx.click(); startGame('level', i); });
      row.appendChild(b);
      map.appendChild(row);
    });
    const focus = map.querySelector('.current') || map.querySelector('.level-node:not(:disabled)');
    if (focus) requestAnimationFrame(() => focus.scrollIntoView({ block: 'center' }));
  }

  function renderStats() {
    const s = loadStats();
    const d = dailyState();
    const rows = [
      ['Rekord (Endlos)', load('klotz-best', 0)],
      ['Gespielte Runden', s.games],
      ['Abgeräumte Linien', s.lines],
      ['Sterne', `${totalStars()} / ${LEVELS.length * 3}`],
      ['Aktuelle Serie', `${d.streak} ${d.streak === 1 ? 'Tag' : 'Tage'}`],
      ['Längste Serie', `${Math.max(s.bestStreak, d.streak)} ${Math.max(s.bestStreak, d.streak) === 1 ? 'Tag' : 'Tage'}`],
      ['Münzen', `🪙 ${coins()}`],
      ['Werbungen angesehen', load('klotz-ads-watched', 0)],
    ];
    $('stats-list').innerHTML = rows.map(([label, value]) =>
      `<div class="row"><span class="label">${label}</span><span class="value">${value}</span></div>`).join('');
  }

  let shopTab = 'skins';

  function freeCoinsLeft() {
    const f = load('klotz-free-coins', { day: null, used: 0 });
    return COINS.freeAdsPerDay - (f.day === todayKey() ? f.used : 0);
  }

  function renderShop() {
    $('shop-coins').textContent = `🪙 ${coins()}`;
    $('tab-skins').setAttribute('aria-selected', String(shopTab === 'skins'));
    $('tab-bgs').setAttribute('aria-selected', String(shopTab === 'bgs'));
    const items = shopTab === 'skins' ? SKINS : BACKGROUNDS;
    const own = owned()[shopTab];
    const selected = shopTab === 'skins' ? skinId : bgTheme;
    const gridEl = $('shop-grid');
    gridEl.innerHTML = '';
    for (const item of items) {
      const card = document.createElement('div');
      card.className = 'shop-item' + (item.id === selected ? ' selected' : '');

      if (shopTab === 'skins') {
        const preview = document.createElement('div');
        preview.className = 'preview-blocks';
        preview.dataset.skin = item.id;
        // A little T and an L in the skin's colours
        [[0,0,0],[0,1,0],[0,2,0],[1,1,0],[1,3,1],[2,3,1],[3,3,1],[3,2,1],[2,0,2],[3,0,2]].forEach(([r, c, k]) => {
          const b = document.createElement('div');
          b.className = 'block';
          b.style.gridRow = r + 1; b.style.gridColumn = c + 1;
          b.style.backgroundColor = item.colors[k * 2];
          b.style.setProperty('--c', item.colors[k * 2]);
          preview.appendChild(b);
        });
        card.appendChild(preview);
      } else {
        const canvas = document.createElement('canvas');
        canvas.className = 'preview-bg';
        card.appendChild(canvas);
        requestAnimationFrame(() => {
          const dpr = window.devicePixelRatio || 1, w = canvas.clientWidth, h = canvas.clientHeight;
          canvas.width = w * dpr; canvas.height = h * dpr;
          const g = canvas.getContext('2d');
          g.setTransform(dpr, 0, 0, dpr, 0, 0);
          paintScene(g, w, h, item.id, 0.35);
        });
      }

      const name = document.createElement('div');
      name.className = 'name';
      name.textContent = item.name;
      card.appendChild(name);

      const btn = document.createElement('button');
      if (item.id === selected) {
        btn.className = 'secondary'; btn.textContent = 'Ausgewählt'; btn.disabled = true;
      } else if (own.includes(item.id)) {
        btn.className = 'secondary'; btn.textContent = 'Auswählen';
        btn.addEventListener('click', () => { sfx.click(); selectItem(item.id); });
      } else if (coins() >= item.price) {
        btn.className = 'primary'; btn.textContent = `Kaufen · 🪙 ${item.price}`;
        btn.addEventListener('click', () => buyItem(item));
      } else {
        btn.className = 'secondary'; btn.textContent = `🪙 ${item.price} · fehlen ${item.price - coins()}`; btn.disabled = true;
      }
      card.appendChild(btn);
      gridEl.appendChild(card);
    }
    const left = freeCoinsLeft();
    $('btn-free-coins').disabled = left <= 0;
    $('btn-free-coins').innerHTML = left > 0
      ? `+${COINS.freeAd} 🪙 gratis<small>Werbung ansehen · heute noch ${left}×</small>`
      : `Gratis-Münzen<small>Morgen wieder verfügbar</small>`;
  }

  function selectItem(id) {
    if (shopTab === 'skins') { skinId = id; save('klotz-skin', id); applySkin(); }
    else { bgTheme = id; save('klotz-bg', id); drawScene(); if (!bgRunning) drawFrame(0); }
    renderShop();
  }

  function buyItem(item) {
    if (coins() < item.price) return;
    addCoins(-item.price);
    const o = owned();
    o[shopTab] = [...o[shopTab], item.id];
    save('klotz-owned', o);
    sfx.win();
    confetti();
    toast(`${item.name} gekauft!`, 2000);
    selectItem(item.id);
  }

  function freeCoins() {
    if (freeCoinsLeft() <= 0) return;
    showAd(`${COINS.freeAd} Münzen`, () => {
      const f = load('klotz-free-coins', { day: null, used: 0 });
      save('klotz-free-coins', { day: todayKey(), used: (f.day === todayKey() ? f.used : 0) + 1 });
      addCoins(COINS.freeAd);
      sfx.star(2);
      toast(`+${COINS.freeAd} 🪙`, 2000);
      renderShop();
    });
  }

  function renderSettings() {
    $('set-sound').setAttribute('aria-checked', String(!muted));
    $('set-music').setAttribute('aria-checked', String(musicOn));
    $('set-calm').setAttribute('aria-checked', String(calm));
    $('btn-pause-sound').textContent = muted ? '🔇 Soundeffekte: aus' : '🔊 Soundeffekte: an';
    $('btn-pause-music').textContent = musicOn ? '🎵 Musik: an' : '🎵 Musik: aus';
  }

  // ---------- Background: animated landscapes (evening hills, beach, winter night) ----------
  // The static parts (sky, sun or moon, hills) are drawn once into an offscreen canvas;
  // each frame only adds twinkling stars, the theme's particles and, on menu screens, falling blocks.
  const bg = $('bg');
  const bgCtx = bg.getContext('2d');
  const scene = document.createElement('canvas');
  const sceneCtx = scene.getContext('2d');
  let bgStars = [], bgParticles = [], bgBlocks = [], bgRunning = false;

  function resizeCanvas(canvas, ctx) {
    const dpr = window.devicePixelRatio || 1;
    canvas.width = innerWidth * dpr;
    canvas.height = innerHeight * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  // Height of a hill layer at x: a few overlapping sine waves.
  const hillY = (x, base, amp, seed) =>
    base - amp * (0.6 * Math.sin(x * 0.006 + seed) + 0.3 * Math.sin(x * 0.013 + seed * 2) + 0.1 * Math.sin(x * 0.031 + seed * 3));

  function fillSky(g, w, h, stops) {
    const sky = g.createLinearGradient(0, 0, 0, h);
    stops.forEach((color, i) => sky.addColorStop(i / (stops.length - 1), color));
    g.fillStyle = sky;
    g.fillRect(0, 0, w, h);
  }

  function fillHill(g, w, h, base, amp, seed, color) {
    g.fillStyle = color;
    g.beginPath();
    g.moveTo(0, h);
    for (let x = 0; x <= w + 10; x += 6) g.lineTo(x, hillY(x, base, amp, seed));
    g.lineTo(w, h);
    g.closePath();
    g.fill();
  }

  function glowDisc(g, w, h, x, y, r, core, halo) {
    const glow = g.createRadialGradient(x, y, r * 0.5, x, y, r * 5);
    glow.addColorStop(0, halo);
    glow.addColorStop(1, 'rgba(0, 0, 0, 0)');
    g.fillStyle = glow;
    g.fillRect(0, 0, w, h);
    g.fillStyle = core;
    g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill();
  }

  // `s` scales fixed-size details so the small shop previews look like the full scene.
  const PAINTERS = {
    evening(g, w, h, s) {
      fillSky(g, w, h, ['#0d0624', '#2a0f55', '#7a1f73', '#d9466f']);
      const mr = Math.min(w, h) * 0.07;
      glowDisc(g, w, h, w * 0.78, h * 0.16, mr, '#fff1c1', 'rgba(255, 228, 150, 0.45)');
      g.fillStyle = 'rgba(230, 200, 140, 0.5)';
      [[-0.3, -0.2, 0.18], [0.25, 0.15, 0.22], [-0.1, 0.4, 0.12]].forEach(([dx, dy, r]) => {
        g.beginPath(); g.arc(w * 0.78 + dx * mr, h * 0.16 + dy * mr, r * mr, 0, Math.PI * 2); g.fill();
      });
      fillHill(g, w, h, h * 0.72, h * 0.06, 1.3, '#4a1a6b');
      fillHill(g, w, h, h * 0.82, h * 0.05, 4.1, '#2e1150');
      fillHill(g, w, h, h * 0.9, h * 0.04, 7.7, '#170a33');
      // Bush silhouettes along the front hill
      for (let x = 20 * s; x < w; x += (70 + (x * 7) % 50) * s) {
        const y = hillY(x, h * 0.9, h * 0.04, 7.7);
        const size = (10 + (x * 13) % 12) * s;
        g.beginPath();
        g.arc(x - size * 0.6, y, size * 0.7, 0, Math.PI * 2);
        g.arc(x, y - size * 0.4, size, 0, Math.PI * 2);
        g.arc(x + size * 0.7, y, size * 0.75, 0, Math.PI * 2);
        g.fill();
      }
    },
    beach(g, w, h, s) {
      fillSky(g, w, h, ['#24104f', '#6d2a7c', '#e0567a', '#ffb36b']);
      const horizon = h * 0.62;
      glowDisc(g, w, h, w * 0.5, horizon, Math.min(w, h) * 0.13, '#ffd27a', 'rgba(255, 190, 110, 0.55)');
      const sea = g.createLinearGradient(0, horizon, 0, h);
      sea.addColorStop(0, '#5a2d8c');
      sea.addColorStop(1, '#1b1452');
      g.fillStyle = sea;
      g.fillRect(0, horizon, w, h - horizon);
      // The sun's reflection: short bright stripes that narrow towards the shore
      g.fillStyle = 'rgba(255, 200, 120, 0.55)';
      for (let i = 0; i < 9; i++) {
        const y = horizon + 6 * s + i * 9 * s;
        const half = (w * 0.12) * (1 - i / 11);
        g.fillRect(w * 0.5 - half, y, half * 2, 2.5 * s);
      }
      fillHill(g, w, h, h * 0.92, h * 0.03, 2.2, '#3a1c4f');
      // Palm silhouettes on the dune
      g.strokeStyle = '#2a1238';
      g.fillStyle = '#2a1238';
      [[0.12, 1], [0.86, 0.85]].forEach(([fx, scale]) => {
        const x = w * fx, y = hillY(w * fx, h * 0.92, h * 0.03, 2.2), height = h * 0.22 * scale;
        g.lineWidth = 6 * s * scale;
        g.beginPath(); g.moveTo(x, y); g.quadraticCurveTo(x + 18 * s, y - height * 0.6, x + 6 * s, y - height); g.stroke();
        const tx = x + 6 * s, ty = y - height;
        for (let k = 0; k < 6; k++) {
          const a = -Math.PI + (k / 5) * Math.PI;
          g.beginPath();
          g.ellipse(tx + Math.cos(a) * 26 * s * scale, ty + Math.sin(a) * 10 * s * scale + 8 * s, 30 * s * scale, 6 * s * scale, a, 0, Math.PI * 2);
          g.fill();
        }
      });
    },
    winter(g, w, h, s) {
      fillSky(g, w, h, ['#030b22', '#0b2350', '#14546e', '#2a7f8f']);
      // Aurora: soft wavy ribbons
      [['rgba(80, 255, 170, 0.22)', 0.22, 0], ['rgba(120, 140, 255, 0.18)', 0.3, 2], ['rgba(80, 255, 200, 0.15)', 0.36, 4]].forEach(([color, base, seed]) => {
        g.strokeStyle = color;
        g.lineWidth = h * 0.06;
        g.lineCap = 'round';
        g.beginPath();
        for (let x = -20; x <= w + 20; x += 8) {
          const y = h * base + Math.sin(x * 0.012 + seed) * h * 0.04 + Math.sin(x * 0.031 + seed) * h * 0.015;
          if (x === -20) g.moveTo(x, y); else g.lineTo(x, y);
        }
        g.stroke();
      });
      glowDisc(g, w, h, w * 0.2, h * 0.12, Math.min(w, h) * 0.05, '#eef6ff', 'rgba(200, 225, 255, 0.35)');
      fillHill(g, w, h, h * 0.74, h * 0.06, 3.1, '#5d86b5');
      // Pine trees on the middle hill
      g.fillStyle = '#163556';
      for (let x = 15 * s; x < w; x += (38 + (x * 11) % 40) * s) {
        const y = hillY(x, h * 0.82, h * 0.05, 5.3) + 4 * s;
        const tall = (34 + (x * 17) % 26) * s;
        g.beginPath(); g.moveTo(x, y - tall); g.lineTo(x - tall * 0.32, y); g.lineTo(x + tall * 0.32, y); g.closePath(); g.fill();
      }
      fillHill(g, w, h, h * 0.82, h * 0.05, 5.3, '#a9c9ea');
      fillHill(g, w, h, h * 0.91, h * 0.035, 8.2, '#e6f2ff');
    },
  };

  const BG_PARTICLES = { evening: 'fireflies', beach: 'sparkles', winter: 'snow' };

  function paintScene(g, w, h, theme, s = 1) {
    (PAINTERS[theme] || PAINTERS.evening)(g, w, h, s);
  }

  function drawScene() {
    resizeCanvas(scene, sceneCtx);
    const w = innerWidth, h = innerHeight;
    paintScene(sceneCtx, w, h, bgTheme);
    bgStars = Array.from({ length: Math.round(w * h / (bgTheme === 'beach' ? 14000 : 6000)) }, () => ({
      x: Math.random() * w, y: Math.random() * h * (bgTheme === 'beach' ? 0.35 : 0.6),
      r: 0.5 + Math.random() * 1.3, phase: Math.random() * Math.PI * 2, speed: 0.5 + Math.random() * 1.5,
    }));
    const kind = BG_PARTICLES[bgTheme];
    bgParticles = Array.from({ length: kind === 'snow' ? 70 : kind === 'sparkles' ? 26 : 16 }, () => ({
      x: Math.random() * w,
      y: kind === 'snow' ? Math.random() * h : kind === 'sparkles' ? h * (0.64 + Math.random() * 0.26) : h * (0.55 + Math.random() * 0.4),
      phase: Math.random() * Math.PI * 2, speed: 0.2 + Math.random() * 0.4, r: 1 + Math.random() * 2.2,
    }));
  }

  function drawParticles(time, w, h) {
    const kind = BG_PARTICLES[bgTheme];
    for (const p of bgParticles) {
      if (kind === 'fireflies') {
        const x = p.x + Math.sin(time * p.speed + p.phase) * 30;
        const y = p.y + Math.cos(time * p.speed * 1.3 + p.phase) * 18;
        const a = 0.4 + 0.6 * (0.5 + 0.5 * Math.sin(time * 2 * p.speed + p.phase));
        const glow = bgCtx.createRadialGradient(x, y, 0, x, y, 10);
        glow.addColorStop(0, `rgba(220, 255, 120, ${a})`);
        glow.addColorStop(1, 'rgba(220, 255, 120, 0)');
        bgCtx.fillStyle = glow;
        bgCtx.fillRect(x - 10, y - 10, 20, 20);
      } else if (kind === 'sparkles') {
        // Glints on the water that flash on and off
        const a = Math.max(0, Math.sin(time * 3 * p.speed + p.phase));
        bgCtx.globalAlpha = a * 0.9;
        bgCtx.fillStyle = '#ffe2b0';
        bgCtx.fillRect(p.x - 4, p.y, 8, 1.5);
        bgCtx.globalAlpha = 1;
      } else {
        p.y += 0.4 + p.r * 0.25;
        const x = p.x + Math.sin(time * p.speed + p.phase) * 12;
        if (p.y > h + 5) { p.y = -5; p.x = Math.random() * w; }
        bgCtx.globalAlpha = 0.85;
        bgCtx.fillStyle = '#ffffff';
        bgCtx.beginPath(); bgCtx.arc(x, p.y, p.r, 0, Math.PI * 2); bgCtx.fill();
        bgCtx.globalAlpha = 1;
      }
    }
  }

  function drawFrame(t) {
    const w = innerWidth, h = innerHeight;
    bgCtx.clearRect(0, 0, w, h);
    bgCtx.drawImage(scene, 0, 0, w, h);
    const time = t / 1000;

    for (const s of bgStars) {
      bgCtx.globalAlpha = 0.35 + 0.65 * (0.5 + 0.5 * Math.sin(time * s.speed + s.phase));
      bgCtx.fillStyle = '#ffffff';
      bgCtx.beginPath(); bgCtx.arc(s.x, s.y, s.r, 0, Math.PI * 2); bgCtx.fill();
    }
    bgCtx.globalAlpha = 1;
    drawParticles(time, w, h);

    // Falling blocks only behind the menus, where the board isn't competing for attention.
    if (currentScreen !== 'screen-game') {
      if (bgBlocks.length < 18 && Math.random() < 0.06) {
        const size = 18 + Math.random() * 26;
        bgBlocks.push({
          x: Math.random() * w, y: -size, size, vy: 0.4 + Math.random() * 0.9,
          rot: Math.random() * 6, vr: (Math.random() - 0.5) * 0.01, color: COLORS[Math.floor(Math.random() * COLORS.length)],
        });
      }
      bgBlocks = bgBlocks.filter(b => b.y < h + 60);
      for (const b of bgBlocks) {
        b.y += b.vy; b.rot += b.vr;
        bgCtx.save();
        bgCtx.globalAlpha = 0.3;
        bgCtx.translate(b.x, b.y);
        bgCtx.rotate(b.rot);
        bgCtx.fillStyle = b.color;
        bgCtx.beginPath();
        bgCtx.roundRect(-b.size / 2, -b.size / 2, b.size, b.size, b.size * 0.2);
        bgCtx.fill();
        bgCtx.restore();
      }
    }
    bgCtx.globalAlpha = 1;
  }

  function stepBg(t) {
    if (!bgRunning) return;
    drawFrame(t);
    requestAnimationFrame(stepBg);
  }

  // With reduced motion the scene is drawn once and stays still.
  function updateBackground() {
    const animate = !reducedMotion();
    if (animate && !bgRunning) { bgRunning = true; requestAnimationFrame(stepBg); }
    if (!animate) { bgRunning = false; bgBlocks = []; drawFrame(0); }
  }

  // ---------- Visual effects: particles, confetti, floating text ----------
  const fx = $('fx');
  const fxCtx = fx.getContext('2d');
  let particles = [];
  let fxRunning = false;

  function onResize() { resizeCanvas(fx, fxCtx); resizeCanvas(bg, bgCtx); drawScene(); if (!bgRunning) drawFrame(0); }
  window.addEventListener('resize', onResize);
  onResize();

  function burst(x, y, color, count, speed = 5) {
    if (reducedMotion()) count = Math.ceil(count / 4);
    for (let i = 0; i < count; i++) {
      const a = Math.random() * Math.PI * 2;
      const v = (0.4 + Math.random()) * speed;
      particles.push({
        x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 2, g: 0.18,
        size: 3 + Math.random() * 5, color, life: 1, decay: 0.018 + Math.random() * 0.02,
        rot: Math.random() * 6, vr: (Math.random() - 0.5) * 0.3, square: Math.random() < 0.6,
      });
    }
    startFx();
  }

  function confetti() {
    const count = reducedMotion() ? 40 : 160;
    for (let i = 0; i < count; i++) {
      particles.push({
        x: Math.random() * innerWidth, y: -20 - Math.random() * innerHeight * 0.5,
        vx: (Math.random() - 0.5) * 3, vy: 2 + Math.random() * 3, g: 0.05,
        size: 6 + Math.random() * 6, color: COLORS[i % COLORS.length], life: 1, decay: 0.004,
        rot: Math.random() * 6, vr: (Math.random() - 0.5) * 0.4, square: true,
      });
    }
    startFx();
  }

  function startFx() {
    if (particles.length > 600) particles = particles.slice(-600);
    if (!fxRunning) { fxRunning = true; requestAnimationFrame(stepFx); }
  }

  function stepFx() {
    fxCtx.clearRect(0, 0, innerWidth, innerHeight);
    particles = particles.filter(p => p.life > 0 && p.y < innerHeight + 40);
    for (const p of particles) {
      p.vy += p.g; p.x += p.vx; p.y += p.vy; p.rot += p.vr; p.life -= p.decay;
      fxCtx.save();
      fxCtx.globalAlpha = Math.max(0, p.life);
      fxCtx.fillStyle = p.color;
      fxCtx.translate(p.x, p.y);
      fxCtx.rotate(p.rot);
      if (p.square) fxCtx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2);
      else { fxCtx.beginPath(); fxCtx.arc(0, 0, p.size / 2, 0, Math.PI * 2); fxCtx.fill(); }
      fxCtx.restore();
    }
    if (particles.length) requestAnimationFrame(stepFx);
    else { fxRunning = false; fxCtx.clearRect(0, 0, innerWidth, innerHeight); }
  }

  function floatText(text, x, y, size = 24) {
    const el = document.createElement('div');
    el.className = 'floater';
    el.textContent = text;
    el.style.left = x + 'px';
    el.style.top = y + 'px';
    el.style.fontSize = size + 'px';
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 900);
  }

  function cellCenter(index) {
    const r = cellEls[index].getBoundingClientRect();
    return [r.left + r.width / 2, r.top + r.height / 2];
  }

  function shakeBoard() {
    if (reducedMotion()) return;
    boardEl.classList.remove('shake');
    void boardEl.offsetWidth;
    boardEl.classList.add('shake');
  }

  let toastTimer;
  function toast(text, ms = 5000) {
    const el = $('toast');
    el.textContent = text;
    el.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { el.hidden = true; }, ms);
  }

  // Friendly break reminder after a long session.
  let sessionStart = Date.now();
  setInterval(() => {
    if (Date.now() - sessionStart >= BREAK_AFTER_MS) {
      sessionStart = Date.now();
      toast('Du spielst schon 20 Minuten. Zeit für eine kleine Pause? 🙂', 8000);
    }
  }, 30000);

  // ---------- Board setup ----------
  for (let i = 0; i < SIZE * SIZE; i++) {
    const c = document.createElement('div');
    c.className = 'cell';
    boardEl.appendChild(c);
    cellEls.push(c);
  }

  function randomShape() {
    let r = rand() * TOTAL_WEIGHT;
    for (const s of SHAPES) { if ((r -= s.weight) < 0) return s.cells; }
    return SHAPES[0].cells;
  }

  function canPlaceOn(g, cells, row, col) {
    return cells.every(([r, c]) => {
      const rr = row + r, cc = col + c;
      return rr >= 0 && rr < SIZE && cc >= 0 && cc < SIZE && !g[rr][cc];
    });
  }
  const canPlace = (cells, row, col) => canPlaceOn(grid, cells, row, col);

  function fitsAnywhere(cells) {
    for (let r = 0; r < SIZE; r++)
      for (let c = 0; c < SIZE; c++)
        if (canPlace(cells, r, c)) return true;
    return false;
  }

  // ---------- Dealer: picks the next three pieces ----------
  // Four tiers: pure chance; a fair hand where all three pieces fit somehow; a hard hand
  // (the worst of several samples), which gets more likely the longer a round lasts;
  // and, during a luck boost, the best of many sampled hands.

  // Place a piece on a copy of the board and clear full lines. `contacts` counts neighbours
  // that are walls or blocks, which rewards placements that keep the board compact.
  function simulateMove(g, cells, row, col) {
    const next = g.map(r => r.slice());
    const own = new Set(cells.map(([r, c]) => (row + r) * SIZE + col + c));
    let contacts = 0;
    for (const [r, c] of cells) {
      const rr = row + r, cc = col + c;
      next[rr][cc] = 1;
      for (const [dr, dc] of [[1,0],[-1,0],[0,1],[0,-1]]) {
        const nr = rr + dr, nc = cc + dc;
        if (nr < 0 || nr >= SIZE || nc < 0 || nc >= SIZE) contacts++;
        else if (g[nr][nc] && !own.has(nr * SIZE + nc)) contacts++;
      }
    }
    const fullRows = [], fullCols = [];
    for (let r = 0; r < SIZE; r++) if (next[r].every(Boolean)) fullRows.push(r);
    for (let c = 0; c < SIZE; c++) if (next.every(rowArr => rowArr[c])) fullCols.push(c);
    fullRows.forEach(r => next[r].fill(null));
    fullCols.forEach(c => next.forEach(rowArr => { rowArr[c] = null; }));
    return { grid: next, lines: fullRows.length + fullCols.length, contacts };
  }

  function bestMove(g, cells) {
    let best = null;
    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        if (!canPlaceOn(g, cells, r, c)) continue;
        const move = simulateMove(g, cells, r, c);
        const value = move.lines * 100 + move.contacts;
        if (!best || value > best.value) best = { ...move, value };
      }
    }
    return best;
  }

  const ORDERS = [[0,1,2],[0,2,1],[1,0,2],[1,2,0],[2,0,1],[2,1,0]];

  // Rates a hand: -Infinity if no order lets all three pieces fit,
  // otherwise more for cleared lines and for free space left afterwards.
  function rateHand(hand) {
    let best = -Infinity;
    for (const order of ORDERS) {
      let g = grid, lines = 0, ok = true;
      for (const i of order) {
        const move = bestMove(g, hand[i].cells);
        if (!move) { ok = false; break; }
        g = move.grid;
        lines += move.lines;
      }
      if (!ok) continue;
      const empty = g.reduce((n, rowArr) => n + rowArr.filter(x => !x).length, 0);
      best = Math.max(best, lines * 10 + empty * 0.3);
    }
    return best;
  }

  // Difficulty ramp: 0 at the start of a round, rising with every hand so each round ends eventually.
  const PRESSURE = { endless: [8, 30], daily: [6, 25], level: [12, 25] };   // [first hand, hands to full pressure]
  const MAX_PRESSURE = 0.85;
  function pressure() {
    const [start, span] = PRESSURE[mode];
    return Math.min(MAX_PRESSURE, Math.max(0, (handsDealt - start) / span));
  }

  // Chance that the next hand is guaranteed to fit completely.
  function fairChance() {
    if (handsDealt < 3) return 1;      // a friendly start
    const filled = grid.reduce((n, rowArr) => n + rowArr.filter(Boolean).length, 0) / (SIZE * SIZE);
    let chance = mode === 'endless' ? 0.3 : 0.45;
    if (filled > 0.5) chance += 0.3;   // a lifeline when the board gets crowded
    return chance * (1 - pressure());
  }

  const LUCKY_SAMPLES = 25;
  const HARD_SAMPLES = 6;
  const FAIR_TRIES = 20;
  const randomPiece = () => ({ cells: randomShape(), color: COLORS[Math.floor(rand() * COLORS.length)] });
  const randomHand = () => [randomPiece(), randomPiece(), randomPiece()];

  function sampleHand(samples, better) {
    let best = null, bestRating = 0;
    for (let i = 0; i < samples; i++) {
      const hand = randomHand();
      const rating = rateHand(hand);
      if (!best || better(rating, bestRating)) { best = hand; bestRating = rating; }
    }
    return best;
  }

  function pickHand() {
    if (luckyHands > 0) return sampleHand(LUCKY_SAMPLES, (a, b) => a > b);
    if (rand() < pressure()) return sampleHand(HARD_SAMPLES, (a, b) => a < b);
    if (rand() < fairChance()) {
      for (let i = 0; i < FAIR_TRIES; i++) {
        const hand = randomHand();
        if (rateHand(hand) > -Infinity) return hand;
      }
    }
    return randomHand();
  }

  function dealPieces() {
    pieces = pickHand();
    // Whatever was picked, at least one piece must fit so a fresh hand is never instantly lost.
    if (!pieces.some(p => fitsAnywhere(p.cells))) {
      for (let tries = 0; tries < 50; tries++) {
        const cells = randomShape();
        if (fitsAnywhere(cells)) { pieces[0].cells = cells; break; }
      }
    }
    handsDealt++;
    if (luckyHands > 0) luckyHands--;
    renderLuck();
  }

  // ---------- Rewarded ads (placeholder) ----------
  const LUCK_HANDS = 3;
  const LUCK_COOLDOWN = 5;   // hands between two luck boosts

  function renderLuck() {
    const btn = $('btn-luck');
    btn.classList.toggle('active', luckyHands > 0);
    if (luckyHands > 0) {
      btn.disabled = true;
      btn.textContent = `🍀 Glück aktiv · noch ${luckyHands} ${luckyHands === 1 ? 'Runde' : 'Runden'}`;
    } else if (handsDealt < luckReadyAt) {
      btn.disabled = true;
      const wait = luckReadyAt - handsDealt;
      btn.textContent = `🍀 Wieder verfügbar in ${wait} ${wait === 1 ? 'Runde' : 'Runden'}`;
    } else {
      btn.disabled = false;
      btn.textContent = '🍀 Bessere Steine · Werbung ansehen';
    }
  }

  // Shows the ad placeholder, counts down, then hands out the reward.
  // In a published game this would call the ad SDK's rewarded ad instead.
  function showAd(rewardText, onReward) {
    $('ad-reward').textContent = `Belohnung: ${rewardText}`;
    $('btn-ad-done').hidden = true;
    showDialog('dlg-ad');
    let left = 3;
    $('ad-count').textContent = left;
    const timer = setInterval(() => {
      left--;
      $('ad-count').textContent = Math.max(left, 0);
      if (left <= 0) {
        clearInterval(timer);
        $('btn-ad-done').hidden = false;
        $('btn-ad-done').onclick = () => {
          sfx.click();
          save('klotz-ads-watched', load('klotz-ads-watched', 0) + 1);
          overlay.classList.remove('show');
          onReward();
        };
      }
    }, 1000);
  }

  function activateLuck() {
    if (over || busy || luckyHands > 0 || handsDealt < luckReadyAt) return;
    showAd(`${LUCK_HANDS} Runden lang die besten Steine`, () => {
      luckyHands = LUCK_HANDS;
      luckReadyAt = handsDealt + LUCK_HANDS + LUCK_COOLDOWN;
      // Swap the current hand right away so the reward is felt immediately.
      dealPieces();
      renderTray();
      confetti();
      toast('🍀 Glück aktiv!', 2000);
    });
  }

  // ---------- Rendering ----------
  function renderBoard() {
    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        const i = r * SIZE + c;
        const el = cellEls[i];
        el.className = 'cell';
        el.style.backgroundColor = '';
        el.style.removeProperty('--c');
        if (isBush(grid[r][c])) {
          el.classList.add('bush');
          if (grid[r][c] === THORNY) el.classList.add('thorny');
        } else if (grid[r][c]) {
          el.classList.add('block');
          el.style.backgroundColor = grid[r][c];
          el.style.setProperty('--c', grid[r][c]);
          if (justPlaced.has(i)) el.classList.add('placed');
        }
      }
    }
  }

  function buildPieceEl(piece, cellSize, gap) {
    const rows = Math.max(...piece.cells.map(([r]) => r)) + 1;
    const cols = Math.max(...piece.cells.map(([, c]) => c)) + 1;
    const el = document.createElement('div');
    el.className = 'piece';
    el.style.gridTemplateColumns = `repeat(${cols}, ${cellSize}px)`;
    el.style.gridTemplateRows = `repeat(${rows}, ${cellSize}px)`;
    el.style.gap = gap + 'px';
    for (const [r, c] of piece.cells) {
      const b = document.createElement('div');
      b.className = 'block';
      b.style.backgroundColor = piece.color;
      b.style.setProperty('--c', piece.color);
      b.style.gridRow = r + 1;
      b.style.gridColumn = c + 1;
      el.appendChild(b);
    }
    return el;
  }

  function renderTray() {
    trayEl.innerHTML = '';
    pieces.forEach((p, i) => {
      const slot = document.createElement('div');
      slot.className = 'slot';
      if (p) {
        const el = buildPieceEl(p, 20, 2);
        if (!fitsAnywhere(p.cells)) el.classList.add('unfit');
        el.addEventListener('pointerdown', e => startDrag(e, i, el));
        slot.appendChild(el);
      }
      trayEl.appendChild(slot);
    });
  }

  // What the current round asks for: a number of lines, or clearing every bush.
  let bushesTotal = 0;
  const bushesLeft = () => grid.reduce((n, rowArr) => n + rowArr.filter(isBush).length, 0);
  const bushGoal = () => mode === 'level' && !LEVELS[level].lines;
  const goalLines = () => mode === 'level' ? LEVELS[level].lines : DAILY_LINES;
  const goalReached = () => bushGoal() ? bushesLeft() === 0 : lines >= goalLines();
  // Stars compare the score with the size of the task; about 2.5 bushes go per cleared line.
  const goalSize = () => bushGoal() ? Math.ceil(bushesTotal / 2.5) : goalLines();

  function renderHud() {
    scoreEl.textContent = score;
    if (mode === 'endless') {
      if (score > best) { best = score; save('klotz-best', best); }
      bestEl.textContent = best;
      statusEl.textContent = 'Endlos';
    } else {
      const name = mode === 'daily' ? 'Tages-Challenge' : `Level ${level + 1}`;
      if (bushGoal()) {
        const left = bushesLeft();
        statusEl.textContent = `${name} · 🌿 noch ${left}`;
        $('goal-fill').style.width = ((bushesTotal - left) / bushesTotal) * 100 + '%';
      } else {
        const goal = goalLines();
        statusEl.textContent = `${name} · ${Math.min(lines, goal)}/${goal} Linien`;
        $('goal-fill').style.width = Math.min(100, (lines / goal) * 100) + '%';
      }
    }
  }

  function bumpScore() {
    scoreEl.classList.remove('bump');
    void scoreEl.offsetWidth;
    scoreEl.classList.add('bump');
  }

  // ---------- Drag & drop ----------
  let drag = null;

  function boardMetrics() {
    const rect = boardEl.getBoundingClientRect();
    const pad = 6, gap = 3;
    const cell = (rect.width - pad * 2 - gap * (SIZE - 1)) / SIZE;
    return { rect, pad, gap, cell };
  }

  function startDrag(e, index, sourceEl) {
    if (busy || over) return;
    e.preventDefault();
    sfx.pick();
    justPlaced = new Set();
    const m = boardMetrics();
    const piece = pieces[index];
    const el = buildPieceEl(piece, m.cell, m.gap);
    dragEl.innerHTML = '';
    dragEl.appendChild(el);
    const w = el.offsetWidth, h = el.offsetHeight;
    // Lift the piece above the finger so it stays visible on touch screens.
    const lift = e.pointerType === 'touch' ? h + 40 : h / 2;
    drag = { index, piece, sourceEl, w, h, lift, target: null };
    sourceEl.classList.add('hidden');
    moveDrag(e);
    window.addEventListener('pointermove', moveDrag);
    window.addEventListener('pointerup', endDrag);
    window.addEventListener('pointercancel', endDrag);
  }

  function moveDrag(e) {
    if (!drag) return;
    const x = e.clientX - drag.w / 2;
    const y = e.clientY - drag.lift;
    dragEl.style.transform = `translate(${x}px, ${y}px)`;

    const m = boardMetrics();
    const step = m.cell + m.gap;
    const col = Math.round((x - m.rect.left - m.pad) / step);
    const row = Math.round((y - m.rect.top - m.pad) / step);
    drag.target = canPlace(drag.piece.cells, row, col) ? { row, col } : null;
    showGhost();
  }

  function showGhost() {
    renderBoard();
    if (!drag || !drag.target) return;
    const { row, col } = drag.target;
    for (const [r, c] of drag.piece.cells) cellEls[(row + r) * SIZE + col + c].classList.add('ghost');
    // Highlight rows/columns that this placement would complete.
    const filled = new Set(drag.piece.cells.map(([r, c]) => (row + r) * SIZE + col + c));
    const isFull = (r, c) => grid[r][c] || filled.has(r * SIZE + c);
    for (let r = 0; r < SIZE; r++) {
      if ([...Array(SIZE).keys()].every(c => isFull(r, c)))
        for (let c = 0; c < SIZE; c++) cellEls[r * SIZE + c].classList.add('will-clear');
    }
    for (let c = 0; c < SIZE; c++) {
      if ([...Array(SIZE).keys()].every(r => isFull(r, c)))
        for (let r = 0; r < SIZE; r++) cellEls[r * SIZE + c].classList.add('will-clear');
    }
  }

  function endDrag(e) {
    window.removeEventListener('pointermove', moveDrag);
    window.removeEventListener('pointerup', endDrag);
    window.removeEventListener('pointercancel', endDrag);
    dragEl.innerHTML = '';
    if (!drag) return;
    const { index, piece, sourceEl, target } = drag;
    drag = null;
    if (target) {
      place(index, piece, target.row, target.col);
    } else {
      // Only buzz when the piece was dropped over the board, not when the player just let go in the tray.
      const rect = boardEl.getBoundingClientRect();
      if (e.type === 'pointerup' && e.clientY < rect.bottom) sfx.invalid();
      sourceEl.classList.remove('hidden');
      renderBoard();
    }
  }

  // ---------- Game logic ----------
  function place(index, piece, row, col) {
    const placedIdx = piece.cells.map(([r, c]) => (row + r) * SIZE + col + c);
    for (const [r, c] of piece.cells) grid[row + r][col + c] = piece.color;
    justPlaced = new Set(placedIdx);
    pieces[index] = null;
    score += piece.cells.length;

    const fullRows = [], fullCols = [];
    for (let r = 0; r < SIZE; r++) if (grid[r].every(Boolean)) fullRows.push(r);
    for (let c = 0; c < SIZE; c++) if (grid.every(rowArr => rowArr[c])) fullCols.push(c);
    const cleared = fullRows.length + fullCols.length;

    renderBoard();
    for (const i of placedIdx) { const [x, y] = cellCenter(i); burst(x, y, piece.color, 3, 2); }

    if (cleared > 0) {
      combo++;
      lines += cleared;
      addStats({ lines: cleared });
      earn(cleared * COINS.line);
      // More lines at once and longer streaks are worth disproportionately more.
      const gained = cleared * 10 * cleared * combo;
      score += gained;
      flashCombo(cleared, combo);
      sfx.clear(cleared, combo);
      bumpScore();

      const toClear = new Set();
      fullRows.forEach(r => { for (let c = 0; c < SIZE; c++) toClear.add(r * SIZE + c); });
      fullCols.forEach(c => { for (let r = 0; r < SIZE; r++) toClear.add(r * SIZE + c); });
      toClear.forEach(i => {
        const v = grid[Math.floor(i / SIZE)][i % SIZE];
        const [x, y] = cellCenter(i);
        if (isBush(v)) {
          // Leaves fly off; a thorny bush only gets shaken this time.
          cellEls[i].classList.add(v === THORNY ? 'hit' : 'clearing');
          BUSH_COLORS[v].forEach(color => burst(x, y, color, 5, 5 + cleared));
        } else {
          cellEls[i].classList.add('clearing');
          burst(x, y, v, 7, 4 + cleared);
        }
      });
      if ([...toClear].some(i => isBush(grid[Math.floor(i / SIZE)][i % SIZE]))) sfx.bush();
      const [fx0, fy0] = cellCenter(placedIdx[0]);
      floatText(`+${gained}`, fx0, fy0, 22 + Math.min(cleared * 4, 16));
      if (cleared > 1 || combo > 2) shakeBoard();

      busy = true;
      setTimeout(() => {
        toClear.forEach(i => {
          const r = Math.floor(i / SIZE), c = i % SIZE;
          grid[r][c] = grid[r][c] === THORNY ? BUSH : null;
        });
        renderHud();
        busy = false;
        afterMove();
      }, 350);
    } else {
      combo = 0;
      sfx.place();
      afterMove();
    }
    renderHud();
  }

  function afterMove() {
    if (pieces.every(p => !p)) dealPieces();
    renderBoard();
    renderTray();
    if (mode !== 'endless' && goalReached()) return winRound();
    if (!pieces.some(p => p && fitsAnywhere(p.cells))) gameOver();
  }

  const PRAISE = ['Super!', 'Klasse!', 'Wow!', 'Genial!', 'Mega!', 'Unglaublich!'];
  let comboTimer;
  function flashCombo(cleared, streak) {
    const parts = [];
    if (cleared > 1 || streak > 1) parts.push(PRAISE[Math.min(cleared + streak - 2, PRAISE.length - 1)]);
    if (cleared > 1) parts.push(`${cleared} Linien`);
    if (streak > 1) parts.push(`Combo x${streak}`);
    if (!parts.length) parts.push('Linie!');
    comboEl.textContent = parts.join('  ·  ');
    comboEl.style.opacity = 1;
    comboEl.classList.remove('pop');
    void comboEl.offsetWidth;
    comboEl.classList.add('pop');
    clearTimeout(comboTimer);
    comboTimer = setTimeout(() => { comboEl.style.opacity = 0; }, 1300);
  }

  function showDialog(id) {
    for (const d of ['dlg-pause', 'dlg-over', 'dlg-win', 'dlg-ad']) $(d).hidden = d !== id;
    overlay.classList.add('show');
  }

  // Coins earned this round, so the end-of-round dialogs can show and double them.
  let roundCoins = 0, endlessCoinsPaid = 0, doubled = false;
  function earn(n) { if (n > 0) { roundCoins += n; addCoins(n); } }

  function gameOver() {
    over = true;
    sfx.gameOver();
    // Endless pays for points; a rescued round only pays for the points added since.
    if (mode === 'endless') {
      const due = Math.floor(score / COINS.endlessPoints);
      earn(due - endlessCoinsPaid);
      endlessCoinsPaid = due;
    }
    $('over-coins').textContent = roundCoins ? `+${roundCoins} 🪙 in dieser Runde` : '';
    const left = bushesLeft();
    const goalText = bushGoal() ? `noch ${left} ${left === 1 ? 'Busch' : 'Büsche'}` : `${lines} von ${goalLines()} Linien`;
    $('over-text').textContent =
      mode === 'endless' ? `Punkte: ${score}` :
      mode === 'daily' ? `Tages-Challenge: ${goalText}` :
      `Level ${level + 1}: ${goalText}`;
    const tries = MAX_RESCUES - rescues;
    $('btn-revive').hidden = tries <= 0;
    $('revive-info').textContent = `Werbung ansehen · noch ${tries}× möglich`;
    setTimeout(() => showDialog('dlg-over'), 400);
  }

  // 1 star for finishing, more for a high score relative to the goal.
  function starsFor(points, goal) {
    if (points >= goal * 40) return 3;
    if (points >= goal * 25) return 2;
    return 1;
  }

  function winRound() {
    over = true;
    const stars = starsFor(score, goalSize());
    $('win-streak').hidden = true;
    // The win bonus is paid once; replays only pay for newly earned stars.
    let bonus = 0;

    if (mode === 'level') {
      const unlocked = load('klotz-unlocked', 1);
      if (level + 2 > unlocked) save('klotz-unlocked', Math.min(level + 2, LEVELS.length));
      const allStars = load('klotz-stars', {});
      const before = allStars[level] || 0;
      bonus = (before ? 0 : COINS.levelWin) + Math.max(0, stars - before) * COINS.perStar;
      allStars[level] = Math.max(before, stars);
      save('klotz-stars', allStars);
      const last = level === LEVELS.length - 1;
      $('win-title').textContent = last ? 'Alle Level geschafft!' : 'Level geschafft!';
      $('win-text').textContent = `Level ${level + 1} mit ${score} Punkten`;
      $('btn-next').hidden = last;
    } else {
      const d = dailyState();
      const today = todayKey();
      const before = d.last === today ? d.stars?.[today] || 0 : 0;
      bonus = (before ? 0 : COINS.dailyWin) + Math.max(0, stars - before) * COINS.perStar;
      if (d.last !== today) { d.streak += 1; d.last = today; }
      d.stars = { [today]: Math.max(before, stars) };
      save('klotz-daily', d);
      const s = loadStats();
      if (d.streak > s.bestStreak) save('klotz-stats', { ...s, bestStreak: d.streak });
      $('win-title').textContent = 'Tages-Challenge geschafft!';
      $('win-text').textContent = `${score} Punkte. Morgen gibt es ein neues Feld.`;
      $('win-streak').textContent = d.streak > 1 ? `🔥 ${d.streak} Tage in Folge` : '🔥 Deine erste Serie beginnt';
      $('win-streak').hidden = false;
      $('btn-next').hidden = true;
    }

    earn(bonus);
    $('win-coins').textContent = `+${roundCoins} 🪙`;
    $('btn-double').hidden = doubled || roundCoins === 0;

    [...$('win-stars').children].forEach((s, i) => s.classList.toggle('on', i < stars));
    setTimeout(() => {
      sfx.win();
      for (let i = 0; i < stars; i++) setTimeout(() => sfx.star(i), 600 + i * 250);
      confetti();
      showDialog('dlg-win');
    }, 400);
  }

  // Rescue (after a rewarded ad): wipe the middle four rows (bushes stay) and deal lucky hands.
  // The difficulty ramp keeps going, so a rescued round still ends at some point.
  function rescue() {
    if (rescues >= MAX_RESCUES) return;
    showAd('Feld wird frei und 2 Runden lang die besten Steine', () => {
      rescues++;
      over = false;
      for (let r = 2; r < 6; r++) grid[r] = grid[r].map(v => isBush(v) ? v : null);
      luckyHands = 2;
      dealPieces();
      renderBoard();
      renderTray();
      confetti();
      toast('Gerettet! Weiter geht’s 🍀', 2000);
    });
  }

  // The daily board: a handful of bushes placed from today's seed, never forming a full line.
  function dailyLayout() {
    const count = 8 + Math.floor(rand() * 7);
    for (let n = 0; n < count; n++) {
      const r = Math.floor(rand() * SIZE), c = Math.floor(rand() * SIZE);
      grid[r][c] = BUSH;
      if (grid[r].every(Boolean) || grid.every(row => row[c])) grid[r][c] = null;
    }
  }

  function startGame(newMode, levelIndex = 0) {
    mode = newMode;
    level = levelIndex;
    rand = mode === 'daily' ? seededRandom(hashString('klotz-' + todayKey())) : Math.random;
    grid = Array.from({ length: SIZE }, () => Array(SIZE).fill(null));
    if (mode === 'level') {
      LEVELS[level].map.forEach((line, r) => {
        [...line].forEach((ch, c) => { if (ch === '#') grid[r][c] = BUSH; if (ch === '@') grid[r][c] = THORNY; });
      });
    } else if (mode === 'daily') {
      dailyLayout();
    }
    score = 0; combo = 0; lines = 0; rescues = 0; busy = false; over = false;
    roundCoins = 0; endlessCoinsPaid = 0; doubled = false;
    bushesTotal = bushesLeft();
    justPlaced = new Set();
    luckyHands = 0; handsDealt = 0; luckReadyAt = 0;
    best = load('klotz-best', 0);
    addStats({ games: 1 });
    $('goal').hidden = mode === 'endless';
    $('best-row').hidden = mode !== 'endless';
    showScreen('screen-game');
    dealPieces();
    renderBoard();
    renderTray();
    renderHud();
  }

  function doubleCoins() {
    if (doubled || !roundCoins) return;
    showAd(`${roundCoins} Münzen extra`, () => {
      doubled = true;
      addCoins(roundCoins);
      roundCoins *= 2;
      $('win-coins').textContent = `+${roundCoins} 🪙`;
      $('btn-double').hidden = true;
      sfx.star(2);
      confetti();
      showDialog('dlg-win');
    });
  }

  // Leaving a round goes back to where the player came from.
  const homeFor = () => mode === 'level' ? 'screen-levels' : 'screen-home';

  // ---------- Wiring ----------
  const on = (id, fn) => $(id).addEventListener('click', () => { sfx.click(); fn(); });

  on('btn-play', () => showScreen('screen-home'));
  on('btn-daily', () => startGame('daily'));
  on('btn-endless', () => startGame('endless'));
  on('btn-levels', () => showScreen('screen-levels'));
  on('btn-stats', () => showScreen('screen-stats'));
  on('btn-shop', () => showScreen('screen-shop'));
  on('tab-skins', () => { shopTab = 'skins'; renderShop(); });
  on('tab-bgs', () => { shopTab = 'bgs'; renderShop(); });
  on('btn-free-coins', freeCoins);
  on('btn-double', doubleCoins);
  on('btn-settings', () => showScreen('screen-settings'));
  document.querySelectorAll('[data-back]').forEach(b =>
    b.addEventListener('click', () => { sfx.click(); showScreen(b.dataset.back); }));

  on('set-sound', () => setMuted(!muted));
  on('set-music', () => setMusic(!musicOn));
  on('set-calm', () => { calm = !calm; save('klotz-calm', calm); renderSettings(); updateBackground(); });
  on('btn-reset', () => { $('reset-confirm').hidden = false; });
  on('btn-reset-no', () => { $('reset-confirm').hidden = true; });
  on('btn-reset-yes', () => {
    try { STORAGE_KEYS.forEach(k => localStorage.removeItem(k)); } catch {}
    skinId = 'classic'; bgTheme = 'evening';
    applySkin(); drawScene(); if (!bgRunning) drawFrame(0);
    $('reset-confirm').hidden = true;
    toast('Fortschritt gelöscht', 2000);
  });

  on('btn-pause', () => { if (!over) showDialog('dlg-pause'); });
  on('btn-resume', () => overlay.classList.remove('show'));
  on('btn-pause-sound', () => setMuted(!muted));
  on('btn-pause-music', () => setMusic(!musicOn));
  on('btn-restart', () => startGame(mode, level));
  on('btn-pause-home', () => showScreen(homeFor()));

  on('btn-luck', activateLuck);
  on('btn-revive', rescue);
  on('btn-retry', () => startGame(mode, level));
  on('btn-over-home', () => showScreen(homeFor()));
  on('btn-next', () => startGame('level', level + 1));
  on('btn-win-retry', () => startGame(mode, level));
  on('btn-win-home', () => showScreen(homeFor()));

  applySkin();
  buildLogo();
  renderTitle();
  renderSettings();
  showScreen('screen-title');
})();
</script>
</body>
</html>
