<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Archen-Tiere</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@500;700;800&display=swap">
<style>
  /* Layout: a single column style sheet; one card per animal, then the animals at in-game sizes. */
  :root {
    --space: #120c30;
    --space-2: #241a5c;
    --card: #2a2160;
    --card-line: #3d3285;
    --text: #fff8ec;
    --muted: #c9bfe8;
    --accent: #ffcf5a;
    --moos: #7bd389;
    --frost: #7cc6f2;
    --font-display: "Baloo 2", "Trebuchet MS", system-ui, sans-serif;
    --font-body: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  html { background: var(--space); }
  body {
    min-height: 100vh; color: var(--text); font-family: var(--font-body);
    background: radial-gradient(circle at 50% 0%, var(--space-2), var(--space) 70%) fixed;
  }
  main { max-width: 760px; margin: 0 auto; padding: 32px 16px 48px; display: flex; flex-direction: column; gap: 28px; }
  h1, h2 { font-family: var(--font-display); margin: 0; line-height: 1.1; text-wrap: balance; }
  h1 { font-size: clamp(32px, 8vw, 48px); color: var(--accent); }
  .intro { color: var(--muted); margin: 6px 0 0; max-width: 60ch; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; }
  .card {
    background: var(--card); border-radius: 22px; padding: 18px 16px 20px; text-align: center;
    box-shadow: inset 0 0 0 2px var(--card-line); display: flex; flex-direction: column; align-items: center; gap: 6px;
    min-width: 0;
  }
  .stage {
    width: 100%; height: 190px; border-radius: 16px; position: relative;
    display: flex; align-items: flex-end; justify-content: center; padding-bottom: 10px;
  }
  .stage.moos { background: radial-gradient(circle at 50% 120%, rgba(123, 211, 137, 0.45), transparent 70%); }
  .stage.frost { background: radial-gradient(circle at 50% 120%, rgba(124, 198, 242, 0.45), transparent 70%); }
  .card h2 { font-size: 24px; }
  .tag { font-size: 12px; font-weight: 800; padding: 3px 10px; border-radius: 999px; color: #10221a; }
  .tag.moos { background: var(--moos); }
  .tag.frost { background: var(--frost); color: #0d2233; }
  .card p { margin: 4px 0 0; color: var(--muted); font-size: 15px; }
  .sizes { background: var(--card); border-radius: 22px; padding: 18px 16px; box-shadow: inset 0 0 0 2px var(--card-line); }
  .sizes h2 { font-size: 22px; margin-bottom: 4px; }
  .sizes p { margin: 0 0 12px; color: var(--muted); }
  .size-row { display: flex; align-items: flex-end; gap: 14px; flex-wrap: wrap; padding: 8px 0; }
  .size-row .label { width: 100%; font-size: 13px; font-weight: 800; color: var(--muted); }
  .heart {
    position: absolute; pointer-events: none; font-size: 22px; color: #ff6b8b;
    animation: heart-up 0.9s ease-out forwards;
  }
  @keyframes heart-up { from { transform: translate(-50%, 0) scale(0.6); opacity: 1; } to { transform: translate(-50%, -80px) scale(1.2); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .heart { animation-duration: 0.01s; } }
</style>
</head>
<body>
<main>
  <header>
    <h1>Die Tiere der Arche</h1>
    <p class="intro">Stil-Test B: runde Formen, dicke Umrisse, große Augen. Die Tiere atmen, blinzeln und wackeln. Tippe eins an, dann freut es sich.</p>
  </header>
  <section class="grid" id="grid"></section>
  <section class="sizes">
    <h2>In Spielgröße</h2>
    <p>So klein erscheinen sie im Spiel: in der Tierstation, in der Tierliste und beim Retten.</p>
    <div class="size-row" id="sizes"></div>
  </section>
</main>
<script src="animals.js"></script>
<script>
  const ANIMALS = [
    { id: 'hase', name: 'Mondhase', planet: 'moos', text: 'Hoppelt nachts über die Brücke und klaut Socken.' },
    { id: 'fuchs', name: 'Moosfuchs', planet: 'moos', text: 'Hat Moos statt Fell und riecht nach Regen.' },
    { id: 'schnecke', name: 'Glühschnecke', planet: 'moos', text: 'Leuchtet, wenn sie glücklich ist. Also fast immer.' },
    { id: 'pinguin', name: 'Frostpinguin', planet: 'frost', text: 'Rutscht lieber, als zu laufen. Auch in der Küche.' },
    { id: 'otter', name: 'Eisotter', planet: 'frost', text: 'Hält beim Schlafen gern jemandem die Pfote.' },
  ];
  const PLANET = { moos: 'Moosmond', frost: 'Frostia' };

  const grid = document.getElementById('grid');
  for (const a of ANIMALS) {
    const card = document.createElement('article');
    card.className = 'card';
    card.innerHTML = `<div class="stage ${a.planet}">${ArcheAnimals.html(a.id, 160)}</div>
      <span class="tag ${a.planet}">${PLANET[a.planet]}</span><h2>${a.name}</h2><p>${a.text}</p>`;
    const stage = card.querySelector('.stage');
    const animal = card.querySelector('.animal');
    animal.addEventListener('click', () => {
      ArcheAnimals.cheer(animal);
      for (let i = 0; i < 3; i++) {
        const h = document.createElement('span');
        h.className = 'heart';
        h.textContent = '❤';
        h.style.left = `${40 + Math.random() * 20}%`;
        h.style.top = `${30 + Math.random() * 20}%`;
        h.style.animationDelay = `${i * 0.12}s`;
        stage.appendChild(h);
        setTimeout(() => h.remove(), 1200);
      }
    });
    grid.appendChild(card);
  }

  const sizes = document.getElementById('sizes');
  for (const size of [96, 56, 28]) {
    sizes.insertAdjacentHTML('beforeend', `<span class="label">${size} px</span>`);
    for (const a of ANIMALS) sizes.insertAdjacentHTML('beforeend', ArcheAnimals.html(a.id, size));
  }
</script>
</body>
</html>
